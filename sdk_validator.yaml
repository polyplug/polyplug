# sdk_validator.yaml
# Configuration for the cross-language SDK validator.
# Defines the golden method set and the target SDK file each language must implement.
#
# Run with: cargo run -p sdk-validator -- --config sdk_validator.yaml --fail-on-missing

version: 1

# Golden method set (authoritative, NOT extracted from code).
# Every language SDK must implement these StringView helper methods.
# Per-method semantics (split/null-view rules, hot-path guarantee): docs/SDK_HELPERS.md
methods:
  StringView:
    - to_str
    - starts_with
    - ends_with
    - strip_prefix
    - split

# Naming conventions per language.
# The validator transforms the snake_case canonical names above to each
# language's convention before searching the target file.
naming:
  rust: snake_case
  python: snake_case
  csharp: PascalCase
  js: camelCase
  cpp: snake_case
  lua: snake_case

# Target SDK file for each language. Paths are relative to the repo root.
targets:
  rust:
    - sdks/rust/guest/src/lib.rs
  python:
    - sdks/python/polyplug_abi/polyplug_abi/string_view_helper.py
  csharp:
    - sdks/csharp/abi/Abi.cs
  js:
    - sdks/js/abi/abi.ts
    - sdks/js/guest/polyplug_guest.js
  cpp:
    - sdks/cpp/abi/polyplug/abi.hpp
  lua:
    - sdks/lua/abi/abi.lua

# Golden enum set (authoritative; the Rust ABI sources are listed as targets
# below, so yaml-vs-code disagreement fails validation and keeps this honest).
# Variant names are PascalCase in EVERY language (no naming transform); the
# generated Lua cdef mirror uses the C `EnumName_Variant` prefix form.
# Per-file exactness: every variant must be present with exactly this value,
# and any extra variant inside the same enum construct is drift.
enums:
  AbiErrorCode:
    Ok: 0
    Generic: 1
    BufferTooSmall: 2
    Panic: 3
    NotFound: 4
    StaleHandle: 5
    FunctionNotAvailable: 6
    DuplicateProvider: 7
    InvalidPointer: 8
    ReentrantCall: 9
    HostContractNotFound: 100
    HostContractVersionMismatch: 101
    HostContractCallFailed: 102
  LogLevel:
    Error: 1
    Warn: 2
    Info: 3
    Debug: 4
    Trace: 5
  DispatchType:
    Native: 0
    VirtualMachine: 1
  ReloadPhaseType:
    Preparing: 0
    Reloaded: 1
    Failed: 2
    Unloading: 3
  SupportedLanguage:
    Rust: 0
    Cpp: 1
    Dotnet: 2
    Python: 3
    Lua: 4
    JavaScript: 5

# Enum mirror targets per language. Paths are relative to the repo root.
# Every listed file must declare the enum with the exact golden variant set.
enum_targets:
  rust:
    AbiErrorCode:
      - crates/polyplug_abi/src/types/error_code.rs
    LogLevel:
      - crates/polyplug_abi/src/types/log_level.rs
    DispatchType:
      - crates/polyplug_abi/src/dispatch/dispatch_type.rs
    ReloadPhaseType:
      - crates/polyplug_abi/src/runtime/reload_phase.rs
    SupportedLanguage:
      - crates/polyplug_abi/src/supported_language.rs
  csharp:
    AbiErrorCode:
      - sdks/csharp/abi/Abi.cs
    LogLevel:
      - sdks/csharp/abi/Abi.cs
    DispatchType:
      - sdks/csharp/abi/Abi.cs
    ReloadPhaseType:
      - sdks/csharp/abi/Abi.cs
      - sdks/csharp/host/ReloadPhase.cs
    SupportedLanguage:
      - sdks/csharp/abi/Abi.cs
  cpp:
    AbiErrorCode:
      - sdks/cpp/abi/polyplug/abi.hpp
    LogLevel:
      - sdks/cpp/abi/polyplug/abi.hpp
    DispatchType:
      - sdks/cpp/abi/polyplug/abi.hpp
    ReloadPhaseType:
      - sdks/cpp/abi/polyplug/abi.hpp
    SupportedLanguage:
      - sdks/cpp/abi/polyplug/abi.hpp
  js:
    AbiErrorCode:
      - sdks/js/abi/abi.ts
      - sdks/js/guest/polyplug_guest.js
    LogLevel:
      - sdks/js/abi/abi.ts
      - sdks/js/guest/polyplug_guest.js
    DispatchType:
      - sdks/js/abi/abi.ts
    ReloadPhaseType:
      - sdks/js/abi/abi.ts
    SupportedLanguage:
      - sdks/js/abi/abi.ts
  python:
    AbiErrorCode:
      - sdks/python/abi/abi.py
    LogLevel:
      - sdks/python/abi/abi.py
    DispatchType:
      - sdks/python/abi/abi.py
    ReloadPhaseType:
      - sdks/python/abi/abi.py
      - sdks/python/polyplug_abi/polyplug_abi/__init__.py
    SupportedLanguage:
      - sdks/python/abi/abi.py
  lua:
    AbiErrorCode:
      - sdks/lua/abi/abi.lua
      - sdks/lua/guest/polyplug_guest.lua
    LogLevel:
      - sdks/lua/abi/abi.lua
      - sdks/lua/guest/polyplug_guest.lua
    DispatchType:
      - sdks/lua/abi/abi.lua
      - sdks/lua/guest/polyplug_guest.lua
    ReloadPhaseType:
      - sdks/lua/abi/abi.lua
    SupportedLanguage:
      - sdks/lua/abi/abi.lua

# Golden struct set (authoritative; the Rust ABI sources are listed as targets
# below, so yaml-vs-code disagreement fails validation and keeps this honest).
# Field names are the canonical snake_case spelling; each mirror's native
# spelling (C# PascalCase, etc.) is normalized back to snake before comparison.
# Declaration ORDER matters: it is the ABI-layout proxy. Pinning AbiError's
# {code, message} shape is the validator's enforcement of the out-param ABI's
# type foundation — a mirror cannot silently change AbiError's layout.
structs:
  StringView:
    - ptr
    - len
  AbiError:
    - code
    - message
  Version:
    - major
    - minor
    - patch
  Array:
    - items
    - len
    - align
  Buffer:
    - ptr
    - len
    - cap
  ArenaOverflowBlock:
    - next
    - capacity
    - used
  CallArena:
    - cur
    - end
    - base
    - host
    - first_overflow
  GuestContractInstance:
    - data
    - contract_id
  BundleInitContext:
    - bundle_id
    - bundle_path

# Struct mirror targets per language. Paths are relative to the repo root.
# Every listed file must declare the struct with the exact golden field set,
# in declaration order. The Rust ABI sources keep the golden set honest.
struct_targets:
  rust:
    StringView:
      - crates/polyplug_abi/src/types/string_view.rs
    AbiError:
      - crates/polyplug_abi/src/types/abi_error.rs
    Version:
      - crates/polyplug_abi/src/types/version.rs
    Array:
      - crates/polyplug_abi/src/types/array.rs
    Buffer:
      - crates/polyplug_abi/src/types/buffer.rs
    ArenaOverflowBlock:
      - crates/polyplug_abi/src/types/call_arena.rs
    CallArena:
      - crates/polyplug_abi/src/types/call_arena.rs
    GuestContractInstance:
      - crates/polyplug_abi/src/guest/guest_contract_instance.rs
    BundleInitContext:
      - crates/polyplug_abi/src/plugin/plugin_context.rs
  csharp:
    StringView:
      - sdks/csharp/abi/Abi.cs
    AbiError:
      - sdks/csharp/abi/Abi.cs
    Version:
      - sdks/csharp/abi/Abi.cs
    Array:
      - sdks/csharp/abi/Abi.cs
    Buffer:
      - sdks/csharp/abi/Abi.cs
    ArenaOverflowBlock:
      - sdks/csharp/abi/Abi.cs
    CallArena:
      - sdks/csharp/abi/Abi.cs
    GuestContractInstance:
      - sdks/csharp/abi/Abi.cs
    BundleInitContext:
      - sdks/csharp/abi/Abi.cs
  cpp:
    StringView:
      - sdks/cpp/abi/polyplug/abi.hpp
    AbiError:
      - sdks/cpp/abi/polyplug/abi.hpp
    Version:
      - sdks/cpp/abi/polyplug/abi.hpp
    Array:
      - sdks/cpp/abi/polyplug/abi.hpp
    Buffer:
      - sdks/cpp/abi/polyplug/abi.hpp
    ArenaOverflowBlock:
      - sdks/cpp/abi/polyplug/abi.hpp
    CallArena:
      - sdks/cpp/abi/polyplug/abi.hpp
    GuestContractInstance:
      - sdks/cpp/abi/polyplug/abi.hpp
    BundleInitContext:
      - sdks/cpp/abi/polyplug/abi.hpp
  python:
    StringView:
      - sdks/python/abi/abi.py
    AbiError:
      - sdks/python/abi/abi.py
    Version:
      - sdks/python/abi/abi.py
    Array:
      - sdks/python/abi/abi.py
    Buffer:
      - sdks/python/abi/abi.py
    ArenaOverflowBlock:
      - sdks/python/abi/abi.py
    CallArena:
      - sdks/python/abi/abi.py
    GuestContractInstance:
      - sdks/python/abi/abi.py
    BundleInitContext:
      - sdks/python/abi/abi.py
  js:
    StringView:
      - sdks/js/abi/abi.ts
    AbiError:
      - sdks/js/abi/abi.ts
    Version:
      - sdks/js/abi/abi.ts
    Array:
      - sdks/js/abi/abi.ts
    Buffer:
      - sdks/js/abi/abi.ts
    ArenaOverflowBlock:
      - sdks/js/abi/abi.ts
    CallArena:
      - sdks/js/abi/abi.ts
    GuestContractInstance:
      - sdks/js/abi/abi.ts
    BundleInitContext:
      - sdks/js/abi/abi.ts
  lua:
    StringView:
      - sdks/lua/abi/abi.lua
    AbiError:
      - sdks/lua/abi/abi.lua
