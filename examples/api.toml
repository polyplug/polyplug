# examples/api.toml — defines the example plugin API
# Two simple string→string contracts for uniform guest examples

[[contract]]
name    = "data.Transformer"
version = "1.0.0"
[[contract.functions]]
name    = "transform"
params  = [{ name = "input", type = "StringView" }]
return  = "StringView"

[[contract]]
name    = "data.Reporter"
version = "1.0.0"
[[contract.functions]]
name    = "report"
params  = [{ name = "value", type = "StringView" }]
return  = "StringView"
