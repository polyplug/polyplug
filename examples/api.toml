# examples/api.toml — Pipeline Data Processing API
# All contracts use StringView for maximum language compatibility

# pipeline.Decoder: Parses CSV input into pipe-delimited format
# Input: "name,value,42"
# Output: "DECODED:name|value|42"
[[guest_contract]]
name = "pipeline.Decoder"
version = "1.0.0"
docs = "Decodes CSV input into the pipeline representation."

[[guest_contract.functions]]
name = "decode"
docs = "Decodes one CSV record."
params = [{ name = "input", type = "StringView", docs = "The CSV record to decode." }]
return = { type = "StringView", docs = "The decoded pipeline record." }

# data.Transformer: Transforms decoded data
# Input: "DECODED:name|value|42"
# Output: "TRANSFORMED:NAME|value (transformed)|43"
[[guest_contract]]
name = "data.Transformer"
version = "1.0.0"

[[guest_contract.functions]]
name = "transform"
params = [{ name = "input", type = "StringView" }]
return = "StringView"

# pipeline.Encoder: Encodes transformed data back to CSV
# Input: "TRANSFORMED:NAME|value (transformed)|43"
# Output: "NAME,value (transformed),43"
[[guest_contract]]
name = "pipeline.Encoder"
version = "1.0.0"

[[guest_contract.functions]]
name = "encode"
params = [{ name = "input", type = "StringView" }]
return = "StringView"

# data.Reporter: Generates human-readable report
# Input: "TRANSFORMED:NAME|value (transformed)|43"
# Output: "Report: NAME has value 'value (transformed)' with count 43"
[[guest_contract]]
name = "data.Reporter"
version = "1.0.0"

[[guest_contract.functions]]
name = "report"
params = [{ name = "input", type = "StringView" }]
return = "StringView"

# pipeline.Validator: Validates data format
# Input: "DECODED:name|value|42"
# Output: "VALID:name|value|42" or "INVALID:reason"
[[guest_contract]]
name = "pipeline.Validator"
version = "1.0.0"

[[guest_contract.functions]]
name = "validate"
params = [{ name = "input", type = "StringView" }]
return = "StringView"

# Custom enum type for logging levels
[[enum]]
name = "LogLevel"
repr = "u32"

[[enum.variants]]
name = "Debug"
value = "0"

[[enum.variants]]
name = "Info"
value = "1"

[[enum.variants]]
name = "Warn"
value = "2"

[[enum.variants]]
name = "Error"
value = "3"

# Host contract: Logging service provided by host to plugins
[[host_contract]]
name = "host.logger"
version = "1.0.0"
docs = "Logging service supplied by the host."

[[host_contract.functions]]
name = "log"
docs = "Writes an informational log message."
params = [{ name = "message", type = "StringView", docs = "Message text to write." }]
return = { type = "void", docs = "Logging has no return value." }

[[host_contract.functions]]
name = "log_with_level"
params = [
    { name = "level", type = "LogLevel" },
    { name = "message", type = "StringView" }
]
return = "void"
