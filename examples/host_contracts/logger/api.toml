# examples/host_contracts/logger/api.toml — Host Contracts Example
# Demonstrates bidirectional communication: host calls plugin, plugin calls host

# Plugin contract: The plugin implements a worker that processes data
# The plugin can call the host's log function to report progress
[[plugin_contract]]
name = "example.worker"
version = "1.0.0"

[[plugin_contract.functions]]
name = "do_work"
params = [{ name = "input", type = "StringView" }]
return = "StringView"

# Host contract: The host implements a logger that plugins can call
# Host contract names MUST start with "host." prefix
[[host_contract]]
name = "host.logger"
version = "1.0.0"

[[host_contract.functions]]
name = "log"
params = [{ name = "message", type = "StringView" }]
returns = "void"