# bundle.toml — Rust encoder guest plugin
# Run: polyplugc generate --bundle bundle.toml --lang rust --out generated/

[bundle]
name    = "rust_encoder"
version = "1.0.0"
runtime = "native"
api     = "../../../api.toml"

[bundle.file]
linux.x86_64   = "libcsv_encoder.so"
linux.aarch64  = "libcsv_encoder.so"
macos.aarch64  = "libcsv_encoder.dylib"
windows.x86_64 = "csv_encoder.dll"

[[plugin]]
name       = "rust_encoder"
version    = "1.0.0"
implements = ["pipeline.Encoder@1.0"]
