[workspace]
resolver = "2"
members = [
    "crates/*",

    "sdks/rust/guest",

    "tests/fixtures/test_plugin",
    "tests/fixtures/memory_plugin",
    "tests/fixtures/error_plugin",
    "tests/fixtures/reload_plugin_v1",
    "tests/fixtures/reload_plugin_v2",
    "tests/fixtures/depender_plugin",
    "tests/fixtures/no_init_plugin",
    "tests/fixtures/register_fail_plugin",
    "tests/fixtures/cross_caller_plugin",
    "tests/fixtures/cross_target_plugin",
    "tests/fixtures/cross_target_plugin_v2",
    "tests/integration",

    "examples/hosts/rust",
    "examples/hosts/parity",
    "examples/guests/rust/decoder",
    "examples/guests/rust/encoder",
    "examples/guests/rust/transformer",
    "examples/guests/rust/reporter",
    "examples/guests/rust/validator",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
polyplug_utils = { version = "0.1.0", path = "crates/polyplug_utils" }
polyplug_abi = { version = "0.1.0", path = "crates/polyplug_abi" }
polyplug = { version = "0.1.0", path = "crates/polyplug" }
polyplug_codegen = { version = "0.1.0", path = "crates/polyplug_codegen" }
polyplug_dotnet = { version = "0.1.0", path = "crates/polyplug_dotnet" }
polyplug_js = { version = "0.1.0", path = "crates/polyplug_js" }
polyplug_lua = { version = "0.1.0", path = "crates/polyplug_lua" }
polyplug_python = { version = "0.1.0", path = "crates/polyplug_python" }
polyplug_native = { version = "0.1.0", path = "crates/polyplug_native" }
polyplugc = { version = "0.1.0", path = "crates/polyplugc" }
polyplug_guest = { version = "0.1.0", path = "sdks/rust/guest" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
toml = { version = "1.1" }

# Error handling
thiserror = { version = "2.0" }
anyhow = { version = "1.0" }

# Serialization formats
serde_yaml = { version = "0.9" }
serde_json = { version = "1.0" }

# Code parsing (build-time)
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }
quote = "1"

# Dynamic loading
libloading = { version = "0.9" }

# Graph algorithms
petgraph = { version = "0.8", default-features = false, features = [
    "stable_graph",
] }

# Lock-free epoch reclamation
crossbeam-epoch = { version = "0.9" }

# Model checker for the epoch publish/reclaim protocol (loom_epoch_model crate,
# pulled in only under `--cfg loom`).
loom = { version = "0.7" }

# CLI (polyplugc only)
clap = { version = "4.6", features = ["derive"] }

criterion = { version = "0.8", features = ["html_reports"] }

# Testing utilities
tempfile = { version = "3.27" }

# .NET hosting
netcorehost = { version = "0.20" }
pelite = { version = "0.10" }
once_cell = { version = "1.21" }

# JavaScript (QuickJS)
rquickjs = { version = "0.12" }

# Lua
mlua = { version = "0.11" }

# Python
pyo3 = { version = "0.28" }
pyo3-build-config = { version = "0.28" }

# Tree-sitter for Lua parsing
tree-sitter = "0.26"
tree-sitter-lua = "0.5"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
clone_on_ref_ptr = "warn"
unwrap_used = "deny"
expect_used = "warn"
std_instead_of_core = "warn"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
improper_ctypes_definitions = "deny"

[profile.release]
opt-level = 3     # maximum optimization
codegen-units = 1 # single codegen unit — maximum cross-function inlining
lto = "thin"      # thin LTO — cross-crate inlining, safe for cdylib
# NOTE: fat LTO + cdylib triggers LLVM crash rust-lang/rust#117220
strip = "symbols"       # remove all symbols — minimum binary size
debug = false           # no debug info
incremental = false     # deterministic builds — never use incremental in release
overflow-checks = false # disable integer overflow checks — zero-cost arithmetic
# NOTE: panic = "abort" is intentionally ABSENT.
# The polyplug runtime uses std::panic::catch_unwind at every FFI boundary
# (12 entry points in ffi/mod.rs + every generated ABI function via codegen).
# panic = "abort" turns catch_unwind into a no-op, causing any plugin panic to
# abort the host process instead of returning AbiErrorCode::Panic.
# This would destroy the runtime's plugin-isolation safety guarantee.

# polyplugc is a build-time CLI tool — optimize for size over raw throughput
[profile.release.package.polyplugc]
opt-level = "z" # "z" = smallest code size (vs "s" which is moderate)
