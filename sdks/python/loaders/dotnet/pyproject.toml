[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyplug-loaders-dotnet"
version = "0.1.1"
description = ".NET loader for polyplug - loads .NET plugins"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "polyplug",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["polyplug_loaders_dotnet*"]

[tool.setuptools.package-data]
polyplug_loaders_dotnet = ["_native/**/*"]