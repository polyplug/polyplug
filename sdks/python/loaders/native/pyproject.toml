[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyplug-loaders-native"
version = "0.1.3"
description = "Native loader for polyplug - loads native C ABI plugins (.so/.dll)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "polyplug",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["polyplug_loaders_native*"]

[tool.setuptools.package-data]
polyplug_loaders_native = ["_native/**/*"]