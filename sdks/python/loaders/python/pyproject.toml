[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyplug-loaders-python"
version = "0.1.0"
description = "Python loader for polyplug - loads Python-based plugins"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "polyplug",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["polyplug_loaders_python*"]

[tool.setuptools.package-data]
polyplug_loaders_python = ["_native/**/*"]