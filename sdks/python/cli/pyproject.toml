[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyplugc"
version = "0.1.2"
description = "polyplugc CLI — contract code-generator for the polyplug plugin runtime"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["polyplug", "plugin", "runtime", "codegen", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Environment :: Console",
    "Topic :: Software Development :: Code Generators",
]

[project.scripts]
polyplugc = "polyplugc.__main__:main"

[project.urls]
Homepage = "https://github.com/polyplug/polyplug"
Documentation = "https://github.com/polyplug/polyplug#readme"
Repository = "https://github.com/polyplug/polyplug.git"
Issues = "https://github.com/polyplug/polyplug/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["polyplugc*"]

[tool.setuptools.package-data]
polyplugc = ["_bin/*", "_bin/.gitkeep"]
