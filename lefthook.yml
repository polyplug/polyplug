# lefthook — every check is its own NAMED command, so you see exactly what runs.
#
# Setup once per clone:        lefthook install
# Run a check by hand:         just fmt-check | just lint | just validate-sdks | just test-all
# Bypass in a REAL emergency:  LEFTHOOK=0 git push

# Every commit: format, import hygiene, SDK consistency, and clippy. clippy IS
# the compile check (cargo check under the hood), so there is no separate build.
pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: just fmt-check
    import-hygiene:
      run: just verify-no-fq-paths
    sdk-validator:
      run: just validate-sdks
    lint:
      glob: "*.rs"
      run: just lint

# Before code leaves the machine: the full test matrix. The code is already
# compiled (clippy at commit time + cargo test here), so no separate build step.
pre-push:
  commands:
    tests:
      run: just test-all

commit-msg:
  commands:
    check-message:
      run: |
        if ! grep -qE '^(feat|fix|docs|style|refactor|test|chore)(\(.+\))?: .+' {1}; then
          echo "Commit message must follow conventional commits format"
          exit 1
        fi
