<svg xmlns='http://www.w3.org/2000/svg' width='806' height='582' viewBox='0 0 806 582'><rect width='806' height='582' fill='#0d1117'/><text x='24.0' y='30.0' font-size='17' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>What does it cost to call one plugin function?</text><text x='24.0' y='47.0' font-size='11' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>one call into a plugin and back, by plugin language — log scale, lower is better</text><rect x='296.0' y='64.0' width='414.0' height='210.0' fill='#0e1f17' rx='2'/><rect x='296.0' y='290.0' width='414.0' height='172.0' fill='#241c0a' rx='2'/><line x1='296.0' y1='56.0' x2='296.0' y2='462.0' stroke='#21262d' stroke-width='1'/><text x='296.0' y='476.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.00 ns</text><line x1='484.8' y1='56.0' x2='484.8' y2='462.0' stroke='#21262d' stroke-width='1'/><text x='484.8' y='476.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>10.0 ns</text><line x1='673.5' y1='56.0' x2='673.5' y2='462.0' stroke='#21262d' stroke-width='1'/><text x='673.5' y='476.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>100 ns</text><text x='296.0' y='77.0' font-size='10' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>NATIVE plugins — the whole bar is polyplug overhead (~1 ns over a raw call)</text><text x='284.0' y='107.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>direct call — no plugin (the floor)</text><rect x='296.0' y='90.0' width='56.6' height='22.0' fill='#6e7681' rx='2'/><text x='360.6' y='107.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.08 ns</text><text x='284.0' y='145.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>raw FFI — dlsym, no safety</text><rect x='296.0' y='128.0' width='56.6' height='22.0' fill='#58a6ff' rx='2'/><text x='360.6' y='145.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.95 ns</text><text x='284.0' y='183.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>polyplug ABI convention (static)</text><rect x='296.0' y='166.0' width='65.9' height='22.0' fill='#58a6ff' rx='2'/><text x='369.9' y='183.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>2.24 ns</text><text x='284.0' y='221.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>polyplug — Rust plugin (.so)</text><rect x='296.0' y='204.0' width='71.8' height='22.0' fill='#3fb950' rx='2'/><text x='375.8' y='221.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>2.40 ns</text><text x='284.0' y='259.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>polyplug — C++ plugin (.so)</text><rect x='296.0' y='242.0' width='78.7' height='22.0' fill='#3fb950' rx='2'/><text x='382.7' y='259.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>2.61 ns</text><text x='296.0' y='303.0' font-size='10' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>VM plugins — the bar is mostly the interpreter's own per-call cost, not polyplug</text><text x='284.0' y='333.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>polyplug — .NET plugin (CLR)</text><rect x='296.0' y='316.0' width='173.1' height='22.0' fill='#58a6ff' rx='2'/><text x='477.1' y='333.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>8.26 ns</text><text x='284.0' y='371.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>polyplug — Lua plugin (LuaJIT)</text><rect x='296.0' y='354.0' width='288.1' height='22.0' fill='#58a6ff' rx='2'/><text x='592.1' y='371.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>33.6 ns</text><text x='284.0' y='409.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>polyplug — Python plugin (GIL, cached)</text><rect x='296.0' y='392.0' width='338.2' height='22.0' fill='#d29922' rx='2'/><text x='642.2' y='409.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>61.9 ns</text><text x='284.0' y='447.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>polyplug — JS plugin (QuickJS)</text><rect x='296.0' y='430.0' width='375.5' height='22.0' fill='#58a6ff' rx='2'/><text x='679.5' y='447.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>97.5 ns</text><text x='503.0' y='492.0' font-size='10' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>time per call — log scale, lower is better →</text><text x='24.0' y='514.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Native dispatch is ~2 ns whatever language wrote the plugin (Rust, C++, C, …) — about one nanosecond over a raw function call, and the whole</text><text x='24.0' y='528.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>bar is polyplug. VM plugins add their interpreter's warm per-call cost: that time belongs to LuaJIT / the CLR / QuickJS / CPython and you</text><text x='24.0' y='542.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>pay it however you embed them, with polyplug's same few-ns dispatch underneath. The two tiers are shaded apart and never ranked together, so</text><text x='24.0' y='556.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>the ~40 ns Lua bar is never misread as 'polyplug is 20x slower than Rust'. One decade longer = 10x slower (log scale). All bars measured</text><text x='24.0' y='570.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>live by cargo bench on one machine — trust the ordering and the gaps, not the absolute ns; see PERFORMANCE.md for the machine + method.</text></svg>
