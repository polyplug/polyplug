<svg xmlns='http://www.w3.org/2000/svg' width='760' height='326' viewBox='0 0 760 326'><rect width='760' height='326' fill='#0d1117'/><text x='24.0' y='30.0' font-size='17' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>A full call-and-return, by what comes back</text><text x='24.0' y='47.0' font-size='11' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Rust app, plugin already looked up — cost depends only on what the plugin hands back (log scale)</text><line x1='250.0' y1='56.0' x2='250.0' y2='260.0' stroke='#21262d' stroke-width='1'/><text x='250.0' y='276.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.00 ns</text><line x1='342.1' y1='56.0' x2='342.1' y2='260.0' stroke='#21262d' stroke-width='1'/><text x='342.1' y='276.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>10.0 ns</text><line x1='434.1' y1='56.0' x2='434.1' y2='260.0' stroke='#21262d' stroke-width='1'/><text x='434.1' y='276.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>100 ns</text><line x1='526.2' y1='56.0' x2='526.2' y2='260.0' stroke='#21262d' stroke-width='1'/><text x='526.2' y='276.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.0 µs</text><line x1='618.2' y1='56.0' x2='618.2' y2='260.0' stroke='#21262d' stroke-width='1'/><text x='618.2' y='276.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>10.0 µs</text><text x='238.0' y='84.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>scalar return (a number)</text><rect x='250.0' y='66.0' width='32.4' height='24.0' fill='#3fb950' rx='2'/><text x='290.4' y='84.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>2.25 ns</text><text x='238.0' y='124.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>borrowed view return (256 B)</text><rect x='250.0' y='106.0' width='28.1' height='24.0' fill='#3fb950' rx='2'/><text x='286.1' y='124.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>2.02 ns</text><text x='238.0' y='164.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>borrowed view return (1 MB)</text><rect x='250.0' y='146.0' width='28.6' height='24.0' fill='#3fb950' rx='2'/><text x='286.6' y='164.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>2.05 ns</text><text x='238.0' y='204.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>owned copy return (256 B)</text><rect x='250.0' y='186.0' width='100.2' height='24.0' fill='#d29922' rx='2'/><text x='358.2' y='204.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>12.3 ns</text><text x='238.0' y='244.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>owned copy return (1 MB)</text><rect x='250.0' y='226.0' width='395.2' height='24.0' fill='#d29922' rx='2'/><text x='653.2' y='244.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>19.7 µs</text><text x='24.0' y='300.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>The round trip itself is ~2 ns — resolve is cached, dispatch is one indirect call. The only thing that grows the cost is copying</text><text x='24.0' y='314.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>data out: borrowed zero-copy views stay flat, owned copies pay a host alloc + memcpy that scales with the payload.</text></svg>
