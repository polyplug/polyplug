<svg xmlns='http://www.w3.org/2000/svg' width='760' height='272' viewBox='0 0 760 272'><rect width='760' height='272' fill='#0d1117'/><text x='24.0' y='30.0' font-size='17' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Native round trip  (host → guest → return)</text><text x='24.0' y='47.0' font-size='11' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Rust host, pre-resolved interface; cost by what the guest returns (log scale)</text><line x1='250.0' y1='56.0' x2='250.0' y2='220.0' stroke='#21262d' stroke-width='1'/><text x='250.0' y='236.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.00 ns</text><line x1='422.3' y1='56.0' x2='422.3' y2='220.0' stroke='#21262d' stroke-width='1'/><text x='422.3' y='236.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>10.0 ns</text><line x1='594.6' y1='56.0' x2='594.6' y2='220.0' stroke='#21262d' stroke-width='1'/><text x='594.6' y='236.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>100 ns</text><text x='238.0' y='84.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>scalar return (u32) — the inc() round trip</text><rect x='250.0' y='66.0' width='60.7' height='24.0' fill='#3fb950' rx='2'/><text x='318.7' y='84.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>2.25 ns</text><text x='238.0' y='124.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>borrowed view return (256 B)</text><rect x='250.0' y='106.0' width='52.0' height='24.0' fill='#3fb950' rx='2'/><text x='310.0' y='124.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>2.00 ns</text><text x='238.0' y='164.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>owned copy return (256 B)</text><rect x='250.0' y='146.0' width='180.3' height='24.0' fill='#d29922' rx='2'/><text x='438.3' y='164.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>11.1 ns</text><text x='238.0' y='204.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>owned copy return (16 KB)</text><rect x='250.0' y='186.0' width='378.8' height='24.0' fill='#d29922' rx='2'/><text x='636.8' y='204.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>158 ns</text><text x='24.0' y='260.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>The round trip itself is ~2 ns — resolve is cached, dispatch is one indirect call. The only thing that grows the cost is copying data out: borrowed zero-copy views stay flat, owned copies pay a host alloc + memcpy that scales with the payload.</text></svg>
