<svg xmlns='http://www.w3.org/2000/svg' width='760' height='356' viewBox='0 0 760 356'><rect width='760' height='356' fill='#0d1117'/><text x='24.0' y='30.0' font-size='17' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>A full call-and-return, by what comes back</text><text x='24.0' y='47.0' font-size='11' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Rust app, plugin already looked up — cost depends only on what the plugin hands back (log scale)</text><line x1='250.0' y1='56.0' x2='250.0' y2='260.0' stroke='#21262d' stroke-width='1'/><text x='250.0' y='276.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.00 ns</text><line x1='342.3' y1='56.0' x2='342.3' y2='260.0' stroke='#21262d' stroke-width='1'/><text x='342.3' y='276.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>10.0 ns</text><line x1='434.5' y1='56.0' x2='434.5' y2='260.0' stroke='#21262d' stroke-width='1'/><text x='434.5' y='276.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>100 ns</text><line x1='526.8' y1='56.0' x2='526.8' y2='260.0' stroke='#21262d' stroke-width='1'/><text x='526.8' y='276.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.0 µs</text><line x1='619.0' y1='56.0' x2='619.0' y2='260.0' stroke='#21262d' stroke-width='1'/><text x='619.0' y='276.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>10.0 µs</text><text x='238.0' y='84.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>borrowed view return (256 B)</text><rect x='250.0' y='66.0' width='27.7' height='24.0' fill='#3fb950' rx='2'/><text x='285.7' y='84.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.97 ns</text><text x='238.0' y='124.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>borrowed view return (1 MB)</text><rect x='250.0' y='106.0' width='28.0' height='24.0' fill='#3fb950' rx='2'/><text x='286.0' y='124.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>2.01 ns</text><text x='238.0' y='164.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>scalar return (a number)</text><rect x='250.0' y='146.0' width='35.1' height='24.0' fill='#3fb950' rx='2'/><text x='293.1' y='164.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>2.40 ns</text><text x='238.0' y='204.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>owned copy return (256 B)</text><rect x='250.0' y='186.0' width='96.8' height='24.0' fill='#d29922' rx='2'/><text x='354.8' y='204.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>11.2 ns</text><text x='238.0' y='244.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>owned copy return (1 MB)</text><rect x='250.0' y='226.0' width='395.2' height='24.0' fill='#d29922' rx='2'/><text x='653.2' y='244.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>19.2 µs</text><text x='457.0' y='294.0' font-size='10' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>time per call — log scale, lower is better →</text><text x='24.0' y='316.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>The round trip itself is ~2 ns — resolve is cached, dispatch is one indirect call. The only thing that grows the cost is copying</text><text x='24.0' y='330.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>data out: borrowed zero-copy views stay flat, owned copies pay a host alloc + memcpy that scales with the payload. Same story over</text><text x='24.0' y='344.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>a size sweep: marshalling.svg (borrow vs copy) and payload_scaling.svg (call cost vs work done).</text></svg>
