<svg xmlns='http://www.w3.org/2000/svg' width='720' height='331' viewBox='0 0 720 331'><rect width='720' height='331' fill='#0d1117'/><text x='24.0' y='30.0' font-size='17' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>What does a safe plugin call cost?</text><text x='24.0' y='47.0' font-size='11' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>counter_inc — the same 1,000,000-call loop, reaching the function a different way each bar (lower is</text><text x='24.0' y='62.0' font-size='11' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>better)</text><text x='238.0' y='98.0' font-size='12' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>direct call (floor)</text><rect x='250.0' y='78.0' width='161.1' height='28.0' fill='#6e7681' rx='2'/><text x='419.1' y='98.0' font-size='12' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.27 ns</text><text x='238.0' y='144.0' font-size='12' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>raw dlsym FFI</text><rect x='250.0' y='124.0' width='243.4' height='28.0' fill='#58a6ff' rx='2'/><text x='501.4' y='144.0' font-size='12' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.92 ns</text><text x='238.0' y='190.0' font-size='12' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>ABI convention (static)</text><rect x='250.0' y='170.0' width='303.7' height='28.0' fill='#58a6ff' rx='2'/><text x='561.7' y='190.0' font-size='12' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>2.40 ns</text><text x='238.0' y='236.0' font-size='12' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>polyplug — Rust plugin</text><rect x='250.0' y='216.0' width='309.7' height='28.0' fill='#3fb950' rx='2'/><text x='567.7' y='236.0' font-size='12' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>2.45 ns</text><text x='238.0' y='282.0' font-size='12' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>polyplug — C++ plugin</text><rect x='250.0' y='262.0' width='333.9' height='28.0' fill='#3fb950' rx='2'/><text x='591.9' y='282.0' font-size='12' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>2.64 ns</text><line x1='250.0' y1='65.0' x2='250.0' y2='301.0' stroke='#21262d' stroke-width='1'/></svg>
