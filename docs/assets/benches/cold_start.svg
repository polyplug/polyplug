<svg xmlns='http://www.w3.org/2000/svg' width='778' height='291' viewBox='0 0 778 291'><rect width='778' height='291' fill='#0d1117'/><text x='24.0' y='30.0' font-size='17' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>First call is cold; steady state is warm</text><text x='24.0' y='47.0' font-size='11' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>the very first dispatch into a just-loaded contract pays a cold-cache tax; every call after is warm (log</text><text x='24.0' y='62.0' font-size='11' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>scale, lower is better)</text><line x1='268.0' y1='71.0' x2='268.0' y2='195.0' stroke='#21262d' stroke-width='1'/><text x='268.0' y='211.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.00 ns</text><line x1='438.1' y1='71.0' x2='438.1' y2='195.0' stroke='#21262d' stroke-width='1'/><text x='438.1' y='211.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>10.0 ns</text><line x1='608.2' y1='71.0' x2='608.2' y2='195.0' stroke='#21262d' stroke-width='1'/><text x='608.2' y='211.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>100 ns</text><text x='256.0' y='99.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>warm — cached pointer dispatch</text><rect x='268.0' y='81.0' width='51.0' height='24.0' fill='#3fb950' rx='2'/><text x='327.0' y='99.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.80 ns</text><text x='256.0' y='139.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>warm — find + resolve + dispatch</text><rect x='268.0' y='121.0' width='247.5' height='24.0' fill='#58a6ff' rx='2'/><text x='523.5' y='139.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>28.5 ns</text><text x='256.0' y='179.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>cold — first dispatch (cache-cold)</text><rect x='268.0' y='161.0' width='379.3' height='24.0' fill='#d29922' rx='2'/><text x='655.3' y='179.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>170 ns</text><text x='475.0' y='229.0' font-size='10' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>time per call — log scale, lower is better →</text><text x='24.0' y='251.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>The cold bar is the first find + resolve + dispatch on a freshly populated registry — a cold HashMap probe + cold interface chase +</text><text x='24.0' y='265.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>cold-icache run of the dispatch path. Warm find+resolve+dispatch is the same work hot in cache; caching the resolved pointer (resolve</text><text x='24.0' y='279.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>once, dispatch many) is the floor. The cold tax is paid roughly once per contract, then amortizes away.</text></svg>
