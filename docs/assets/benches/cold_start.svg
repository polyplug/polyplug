<svg xmlns='http://www.w3.org/2000/svg' width='760' height='275' viewBox='0 0 760 275'><rect width='760' height='275' fill='#0d1117'/><text x='24.0' y='30.0' font-size='17' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>First call is cold; steady state is warm</text><text x='24.0' y='47.0' font-size='11' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>the very first dispatch into a just-loaded contract pays a cold-cache tax; every call after is warm (log</text><text x='24.0' y='62.0' font-size='11' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>scale, lower is better)</text><line x1='250.0' y1='71.0' x2='250.0' y2='195.0' stroke='#21262d' stroke-width='1'/><text x='250.0' y='211.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.00 ns</text><line x1='420.1' y1='71.0' x2='420.1' y2='195.0' stroke='#21262d' stroke-width='1'/><text x='420.1' y='211.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>10.0 ns</text><line x1='590.2' y1='71.0' x2='590.2' y2='195.0' stroke='#21262d' stroke-width='1'/><text x='590.2' y='211.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>100 ns</text><text x='238.0' y='99.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>cold — first dispatch (cache-cold)</text><rect x='250.0' y='81.0' width='379.3' height='24.0' fill='#d29922' rx='2'/><text x='637.3' y='99.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>170 ns</text><text x='238.0' y='139.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>warm — find + resolve + dispatch</text><rect x='250.0' y='121.0' width='247.5' height='24.0' fill='#58a6ff' rx='2'/><text x='505.5' y='139.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>28.5 ns</text><text x='238.0' y='179.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>warm — cached pointer dispatch</text><rect x='250.0' y='161.0' width='51.0' height='24.0' fill='#3fb950' rx='2'/><text x='309.0' y='179.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.80 ns</text><text x='24.0' y='235.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>The cold bar is the first find + resolve + dispatch on a freshly populated registry — a cold HashMap probe + cold interface chase +</text><text x='24.0' y='249.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>cold-icache run of the dispatch path. Warm find+resolve+dispatch is the same work hot in cache; caching the resolved pointer</text><text x='24.0' y='263.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>(resolve once, dispatch many) is the floor. The cold tax is paid roughly once per contract, then amortizes away.</text></svg>
