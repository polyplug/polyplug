<svg xmlns='http://www.w3.org/2000/svg' width='720' height='270' viewBox='0 0 720 270'><rect width='720' height='270' fill='#0d1117'/><text x='24.0' y='30.0' font-size='17' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Dispatch cost by argument shape (lower is better)</text><text x='24.0' y='47.0' font-size='11' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>scalar args are ~free; a buffer fill and a cross-plugin lookup add real work</text><text x='238.0' y='83.0' font-size='12' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>struct arg + scalar return</text><rect x='250.0' y='63.0' width='18.6' height='28.0' fill='#3fb950' rx='2'/><text x='276.6' y='83.0' font-size='12' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.96 ns</text><text x='238.0' y='129.0' font-size='12' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>noop — add(0,0)</text><rect x='250.0' y='109.0' width='18.9' height='28.0' fill='#3fb950' rx='2'/><text x='276.9' y='129.0' font-size='12' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.99 ns</text><text x='238.0' y='175.0' font-size='12' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>4 KB buffer fill</text><rect x='250.0' y='155.0' width='281.5' height='28.0' fill='#58a6ff' rx='2'/><text x='539.5' y='175.0' font-size='12' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>29.7 ns</text><text x='238.0' y='221.0' font-size='12' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>cross-plugin (find+resolve+call)</text><rect x='250.0' y='201.0' width='333.9' height='28.0' fill='#58a6ff' rx='2'/><text x='591.9' y='221.0' font-size='12' fill='#c9d1d9' text-anchor='st