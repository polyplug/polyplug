<svg xmlns='http://www.w3.org/2000/svg' width='720' height='285' viewBox='0 0 720 285'><rect width='720' height='285' fill='#0d1117'/><text x='24.0' y='30.0' font-size='17' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>What you pass changes the cost</text><text x='24.0' y='47.0' font-size='11' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>a plain number is almost free; a 4 KB buffer or a fresh plugin lookup adds real work (lower is</text><text x='24.0' y='62.0' font-size='11' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>better)</text><text x='238.0' y='98.0' font-size='12' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>struct arg + scalar return</text><rect x='250.0' y='78.0' width='18.4' height='28.0' fill='#3fb950' rx='2'/><text x='276.4' y='98.0' font-size='12' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>2.17 ns</text><text x='238.0' y='144.0' font-size='12' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>noop — add(0,0)</text><rect x='250.0' y='124.0' width='16.5' height='28.0' fill='#3fb950' rx='2'/><text x='274.5' y='144.0' font-size='12' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.94 ns</text><text x='238.0' y='190.0' font-size='12' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>4 KB buffer fill</text><rect x='250.0' y='170.0' width='254.6' height='28.0' fill='#58a6ff' rx='2'/><text x='512.6' y='190.0' font-size='12' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>30.0 ns</text><text x='238.0' y='236.0' font-size='12' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>cross-plugin (find+resolve+call)</text><rect x='250.0' y='216.0' width='333.9' height='28.0' fill='#58a6ff' rx='2'/><text x='591.9' y='236.0' font-size='12' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>39.3 ns</text><line x1='250.0' y1='65.0' x2='250.0' y2='255.0' stroke='#21262d' stroke-width='1'/></svg>
