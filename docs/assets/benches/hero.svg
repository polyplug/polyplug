<svg xmlns='http://www.w3.org/2000/svg' width='806' height='492' viewBox='0 0 806 492'><rect width='806' height='492' fill='#0d1117'/><text x='24.0' y='30.0' font-size='17' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>One plugin call, end to end</text><text x='24.0' y='47.0' font-size='11' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>time to call one plugin function and get the answer back, by plugin language (log scale, lower is better)</text><rect x='296.0' y='64.0' width='414.0' height='134.0' fill='#0e1f17' rx='2'/><rect x='296.0' y='214.0' width='414.0' height='172.0' fill='#241c0a' rx='2'/><line x1='296.0' y1='56.0' x2='296.0' y2='386.0' stroke='#21262d' stroke-width='1'/><text x='296.0' y='400.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.00 ns</text><line x1='484.8' y1='56.0' x2='484.8' y2='386.0' stroke='#21262d' stroke-width='1'/><text x='484.8' y='400.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>10.0 ns</text><line x1='673.5' y1='56.0' x2='673.5' y2='386.0' stroke='#21262d' stroke-width='1'/><text x='673.5' y='400.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>100 ns</text><text x='296.0' y='77.0' font-size='10' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>NATIVE — the whole bar is polyplug overhead (~1 ns over a raw call)</text><text x='284.0' y='107.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>direct function call (no plugins)</text><rect x='296.0' y='90.0' width='56.6' height='22.0' fill='#6e7681' rx='2'/><text x='360.6' y='107.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.08 ns</text><text x='284.0' y='145.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>raw FFI (dlsym, no safety)</text><rect x='296.0' y='128.0' width='56.6' height='22.0' fill='#6e7681' rx='2'/><text x='360.6' y='145.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.95 ns</text><text x='284.0' y='183.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>polyplug — native plugin (Rust/C++)</text><rect x='296.0' y='166.0' width='71.8' height='22.0' fill='#3fb950' rx='2'/><text x='375.8' y='183.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>2.40 ns</text><text x='296.0' y='227.0' font-size='10' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>VM — mostly the interpreter's own per-call cost, not polyplug</text><text x='284.0' y='257.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>polyplug — .NET plugin (CLR)</text><rect x='296.0' y='240.0' width='173.1' height='22.0' fill='#58a6ff' rx='2'/><text x='477.1' y='257.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>8.26 ns</text><text x='284.0' y='295.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>polyplug — Lua plugin (LuaJIT)</text><rect x='296.0' y='278.0' width='288.1' height='22.0' fill='#58a6ff' rx='2'/><text x='592.1' y='295.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>33.6 ns</text><text x='284.0' y='333.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>polyplug — Python plugin (GIL, cached)</text><rect x='296.0' y='316.0' width='338.2' height='22.0' fill='#58a6ff' rx='2'/><text x='642.2' y='333.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>61.9 ns</text><text x='284.0' y='371.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>polyplug — JS plugin (QuickJS)</text><rect x='296.0' y='354.0' width='375.5' height='22.0' fill='#d29922' rx='2'/><text x='679.5' y='371.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>97.5 ns</text><text x='503.0' y='416.0' font-size='10' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>time per call — log scale, lower is better →</text><text x='24.0' y='438.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>All bars measured live by cargo bench on one machine. A native plugin costs about one extra nanosecond over a raw function call, and the</text><text x='24.0' y='452.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>whole bar is polyplug. VM plugins add their interpreter's warm per-call cost (Python: GIL held, function cached — its attach-per-call arm is</text><text x='24.0' y='466.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>close behind, see PERFORMANCE.md); that cost is the language, not polyplug. The tiers are shaded apart and never ranked together. One decade</text><text x='24.0' y='480.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>longer = 10x slower (log scale).</text></svg>
