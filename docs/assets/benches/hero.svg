<svg xmlns='http://www.w3.org/2000/svg' width='760' height='420' viewBox='0 0 760 420'><rect width='760' height='420' fill='#0d1117'/><text x='24.0' y='30.0' font-size='17' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>One plugin call, end to end</text><text x='24.0' y='47.0' font-size='11' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>time to call one plugin function and get the answer back, by plugin language (log scale, lower is better)</text><line x1='250.0' y1='56.0' x2='250.0' y2='340.0' stroke='#21262d' stroke-width='1'/><text x='250.0' y='356.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.00 ns</text><line x1='438.8' y1='56.0' x2='438.8' y2='340.0' stroke='#21262d' stroke-width='1'/><text x='438.8' y='356.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>10.0 ns</text><line x1='627.5' y1='56.0' x2='627.5' y2='340.0' stroke='#21262d' stroke-width='1'/><text x='627.5' y='356.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>100 ns</text><text x='238.0' y='84.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>direct function call (no plugins)</text><rect x='250.0' y='66.0' width='56.6' height='24.0' fill='#6e7681' rx='2'/><text x='314.6' y='84.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.08 ns</text><text x='238.0' y='124.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>raw FFI (dlsym, no safety)</text><rect x='250.0' y='106.0' width='56.6' height='24.0' fill='#6e7681' rx='2'/><text x='314.6' y='124.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.95 ns</text><text x='238.0' y='164.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>polyplug — native plugin (Rust/C++)</text><rect x='250.0' y='146.0' width='71.8' height='24.0' fill='#3fb950' rx='2'/><text x='329.8' y='164.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>2.40 ns</text><text x='238.0' y='204.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>polyplug — .NET plugin</text><rect x='250.0' y='186.0' width='173.1' height='24.0' fill='#58a6ff' rx='2'/><text x='431.1' y='204.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>8.26 ns</text><text x='238.0' y='244.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>polyplug — Lua plugin (LuaJIT)</text><rect x='250.0' y='226.0' width='288.1' height='24.0' fill='#58a6ff' rx='2'/><text x='546.1' y='244.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>33.6 ns</text><text x='238.0' y='284.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>polyplug — JS plugin (QuickJS)</text><rect x='250.0' y='266.0' width='375.5' height='24.0' fill='#58a6ff' rx='2'/><text x='633.5' y='284.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>97.5 ns</text><text x='238.0' y='324.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>polyplug — Python plugin (cached)</text><rect x='250.0' y='306.0' width='338.2' height='24.0' fill='#d29922' rx='2'/><text x='596.2' y='324.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>61.9 ns</text><text x='24.0' y='380.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>All bars measured live by cargo bench on one machine. A native plugin costs about one extra nanosecond over a raw function call; VM</text><text x='24.0' y='394.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>plugins add their interpreter's warm per-call cost (Python: GIL held, function cached — its attach-per-call arm is close behind,</text><text x='24.0' y='408.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>see PERFORMANCE.md). A bar twice as long is 10x slower (log scale).</text></svg>
