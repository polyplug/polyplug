<svg xmlns='http://www.w3.org/2000/svg' width='760' height='396' viewBox='0 0 760 396'><rect width='760' height='396' fill='#0d1117'/><text x='24.0' y='30.0' font-size='17' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Calling into a plugin, by plugin language</text><text x='24.0' y='47.0' font-size='11' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>warm per-call cost the runtime pays to run a plugin written in each language (log scale, lower is better)</text><line x1='250.0' y1='56.0' x2='250.0' y2='300.0' stroke='#21262d' stroke-width='1'/><text x='250.0' y='316.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.00 ns</text><line x1='438.8' y1='56.0' x2='438.8' y2='300.0' stroke='#21262d' stroke-width='1'/><text x='438.8' y='316.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>10.0 ns</text><line x1='627.5' y1='56.0' x2='627.5' y2='300.0' stroke='#21262d' stroke-width='1'/><text x='627.5' y='316.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>100 ns</text><text x='238.0' y='84.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Rust (native cdylib)</text><rect x='250.0' y='66.0' width='71.8' height='24.0' fill='#3fb950' rx='2'/><text x='329.8' y='84.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>2.40 ns</text><text x='238.0' y='124.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>C++ (native cdylib)</text><rect x='250.0' y='106.0' width='78.7' height='24.0' fill='#3fb950' rx='2'/><text x='336.7' y='124.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>2.61 ns</text><text x='238.0' y='164.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>.NET (CLR, UnmanagedCallersOnly)</text><rect x='250.0' y='146.0' width='173.1' height='24.0' fill='#58a6ff' rx='2'/><text x='431.1' y='164.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>8.26 ns</text><text x='238.0' y='204.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Lua (LuaJIT)</text><rect x='250.0' y='186.0' width='288.1' height='24.0' fill='#58a6ff' rx='2'/><text x='546.1' y='204.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>33.6 ns</text><text x='238.0' y='244.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Python (GIL held, cached)</text><rect x='250.0' y='226.0' width='338.2' height='24.0' fill='#58a6ff' rx='2'/><text x='596.2' y='244.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>61.9 ns</text><text x='238.0' y='284.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>JavaScript (QuickJS, cached)</text><rect x='250.0' y='266.0' width='375.5' height='24.0' fill='#58a6ff' rx='2'/><text x='633.5' y='284.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>97.5 ns</text><text x='457.0' y='334.0' font-size='10' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>time per call — log scale, lower is better →</text><text x='24.0' y='356.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>All bars measured live: native from counter_inc; .NET/Lua/Python/JS from each loader's warm cached-dispatch bench. Python's</text><text x='24.0' y='370.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>attach-per-call arm (gil_acquire_and_call) measures ~56 ns — almost the same as the cached bar, since an uncontended GIL re-attach</text><text x='24.0' y='384.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>is nearly free; the old ~13 µs figure was a recompile-per-iteration artifact (see PERFORMANCE.md).</text></svg>
