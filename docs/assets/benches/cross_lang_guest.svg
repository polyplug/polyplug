<svg xmlns='http://www.w3.org/2000/svg' width='760' height='352' viewBox='0 0 760 352'><rect width='760' height='352' fill='#0d1117'/><text x='24.0' y='30.0' font-size='17' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Calling into a plugin, by plugin language</text><text x='24.0' y='47.0' font-size='11' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>warm per-call cost the runtime pays to run a plugin written in each language (log scale, lower is better)</text><line x1='250.0' y1='56.0' x2='250.0' y2='300.0' stroke='#21262d' stroke-width='1'/><text x='250.0' y='316.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.00 ns</text><line x1='446.0' y1='56.0' x2='446.0' y2='300.0' stroke='#21262d' stroke-width='1'/><text x='446.0' y='316.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>10.0 ns</text><line x1='642.0' y1='56.0' x2='642.0' y2='300.0' stroke='#21262d' stroke-width='1'/><text x='642.0' y='316.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>100 ns</text><text x='238.0' y='84.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Rust (native cdylib)</text><rect x='250.0' y='66.0' width='69.1' height='24.0' fill='#3fb950' rx='2'/><text x='327.1' y='84.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>2.25 ns</text><text x='238.0' y='124.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>C++ (native cdylib)</text><rect x='250.0' y='106.0' width='77.2' height='24.0' fill='#3fb950' rx='2'/><text x='335.2' y='124.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>2.48 ns</text><text x='238.0' y='164.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>.NET (CLR, UnmanagedCallersOnly)</text><rect x='250.0' y='146.0' width='206.8' height='24.0' fill='#58a6ff' rx='2'/><text x='464.8' y='164.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>11.4 ns</text><text x='238.0' y='204.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Lua (LuaJIT)</text><rect x='250.0' y='186.0' width='305.8' height='24.0' fill='#58a6ff' rx='2'/><text x='563.8' y='204.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>36.3 ns</text><text x='238.0' y='244.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Python (GIL held, cached)</text><rect x='250.0' y='226.0' width='348.6' height='24.0' fill='#58a6ff' rx='2'/><text x='606.6' y='244.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>60.1 ns</text><text x='238.0' y='284.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>JavaScript (QuickJS, cached)</text><rect x='250.0' y='266.0' width='374.0' height='24.0' fill='#58a6ff' rx='2'/><text x='632.0' y='284.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>81.0 ns</text><text x='24.0' y='340.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>All bars measured live: native from counter_inc; .NET/Lua/Python/JS from each loader's warm cached-dispatch bench. Python additionally pays a one-time ~12 µs GIL acquire + compile on a cold call (see PERFORMANCE.md).</text></svg>
