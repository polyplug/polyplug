<svg xmlns='http://www.w3.org/2000/svg' width='760' height='380' viewBox='0 0 760 380'><rect width='760' height='380' fill='#0d1117'/><text x='24.0' y='30.0' font-size='17' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Calling into a plugin, by plugin language</text><text x='24.0' y='47.0' font-size='11' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>warm per-call cost the runtime pays to run a plugin written in each language (log scale, lower is better)</text><line x1='250.0' y1='56.0' x2='250.0' y2='300.0' stroke='#21262d' stroke-width='1'/><text x='250.0' y='316.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.00 ns</text><line x1='446.0' y1='56.0' x2='446.0' y2='300.0' stroke='#21262d' stroke-width='1'/><text x='446.0' y='316.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>10.0 ns</text><line x1='642.0' y1='56.0' x2='642.0' y2='300.0' stroke='#21262d' stroke-width='1'/><text x='642.0' y='316.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>100 ns</text><text x='238.0' y='84.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Rust (native cdylib)</text><rect x='250.0' y='66.0' width='76.2' height='24.0' fill='#3fb950' rx='2'/><text x='334.2' y='84.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>2.45 ns</text><text x='238.0' y='124.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>C++ (native cdylib)</text><rect x='250.0' y='106.0' width='82.6' height='24.0' fill='#3fb950' rx='2'/><text x='340.6' y='124.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>2.64 ns</text><text x='238.0' y='164.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>.NET (CLR, UnmanagedCallersOnly)</text><rect x='250.0' y='146.0' width='170.4' height='24.0' fill='#58a6ff' rx='2'/><text x='428.4' y='164.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>7.40 ns</text><text x='238.0' y='204.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Lua (LuaJIT)</text><rect x='250.0' y='186.0' width='302.5' height='24.0' fill='#58a6ff' rx='2'/><text x='560.5' y='204.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>35.0 ns</text><text x='238.0' y='244.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Python (GIL held, cached)</text><rect x='250.0' y='226.0' width='347.9' height='24.0' fill='#58a6ff' rx='2'/><text x='605.9' y='244.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>59.6 ns</text><text x='238.0' y='284.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>JavaScript (QuickJS, cached)</text><rect x='250.0' y='266.0' width='374.0' height='24.0' fill='#58a6ff' rx='2'/><text x='632.0' y='284.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>81.0 ns</text><text x='24.0' y='340.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>All bars measured live: native from counter_inc; .NET/Lua/Python/JS from each loader's warm cached-dispatch bench. Python's</text><text x='24.0' y='354.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>attach-per-call arm (gil_acquire_and_call) measures ~56 ns — almost the same as the cached bar, since an uncontended GIL re-attach</text><text x='24.0' y='368.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>is nearly free; the old ~13 µs figure was a recompile-per-iteration artifact (see PERFORMANCE.md).</text></svg>
