<svg xmlns='http://www.w3.org/2000/svg' width='760' height='352' viewBox='0 0 760 352'><rect width='760' height='352' fill='#0d1117'/><text x='24.0' y='30.0' font-size='17' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Reaching the runtime, by app language</text><text x='24.0' y='47.0' font-size='11' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>per-call cost for an app in each language to cross into the runtime (log scale, lower is better)</text><line x1='250.0' y1='56.0' x2='250.0' y2='300.0' stroke='#21262d' stroke-width='1'/><text x='250.0' y='316.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.00 ns</text><line x1='386.6' y1='56.0' x2='386.6' y2='300.0' stroke='#21262d' stroke-width='1'/><text x='386.6' y='316.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>10.0 ns</text><line x1='523.2' y1='56.0' x2='523.2' y2='300.0' stroke='#21262d' stroke-width='1'/><text x='523.2' y='316.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>100 ns</text><line x1='659.9' y1='56.0' x2='659.9' y2='300.0' stroke='#21262d' stroke-width='1'/><text x='659.9' y='316.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.0 µs</text><text x='238.0' y='84.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Rust (links the crate, no FFI)</text><rect x='250.0' y='66.0' width='41.1' height='24.0' fill='#3fb950' rx='2'/><text x='299.1' y='84.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>2.00 ns</text><text x='238.0' y='124.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>C++ (native)</text><rect x='250.0' y='106.0' width='160.7' height='24.0' fill='#58a6ff' rx='2'/><text x='418.7' y='124.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>15.0 ns</text><text x='238.0' y='164.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Lua (LuaJIT FFI)</text><rect x='250.0' y='146.0' width='211.0' height='24.0' fill='#58a6ff' rx='2'/><text x='469.0' y='164.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>35.0 ns</text><text x='238.0' y='204.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>JavaScript (Deno FFI)</text><rect x='250.0' y='186.0' width='256.2' height='24.0' fill='#58a6ff' rx='2'/><text x='514.2' y='204.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>75.0 ns</text><text x='238.0' y='244.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Python (cffi ABI)</text><rect x='250.0' y='226.0' width='352.5' height='24.0' fill='#d29922' rx='2'/><text x='610.5' y='244.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>380 ns</text><text x='238.0' y='284.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Python (ctypes)</text><rect x='250.0' y='266.0' width='386.1' height='24.0' fill='#d29922' rx='2'/><text x='644.1' y='284.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>670 ns</text><text x='24.0' y='340.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>A Rust host links libpolyplug directly — there is no FFI boundary, so it is the floor. C++/Lua/JS are the fast FFI end; Python's dynamic FFI is the cost of its convenience. Host FFI micro-benchmarks — see docs/PERFORMANCE.md.</text></svg>
