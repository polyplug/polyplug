<svg xmlns='http://www.w3.org/2000/svg' width='760' height='380' viewBox='0 0 760 380'><rect width='760' height='380' fill='#0d1117'/><text x='24.0' y='30.0' font-size='17' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Reaching the runtime, by app language</text><text x='24.0' y='47.0' font-size='11' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>one find_guest_contract call through the runtime, per host language — measured, log scale, lower is better</text><line x1='250.0' y1='56.0' x2='250.0' y2='300.0' stroke='#21262d' stroke-width='1'/><text x='250.0' y='316.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.00 ns</text><line x1='366.8' y1='56.0' x2='366.8' y2='300.0' stroke='#21262d' stroke-width='1'/><text x='366.8' y='316.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>10.0 ns</text><line x1='483.6' y1='56.0' x2='483.6' y2='300.0' stroke='#21262d' stroke-width='1'/><text x='483.6' y='316.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>100 ns</text><line x1='600.4' y1='56.0' x2='600.4' y2='300.0' stroke='#21262d' stroke-width='1'/><text x='600.4' y='316.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.0 µs</text><text x='238.0' y='84.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Rust (links the crate, no FFI)</text><rect x='250.0' y='66.0' width='149.8' height='24.0' fill='#3fb950' rx='2'/><text x='407.8' y='84.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>19.2 ns</text><text x='238.0' y='124.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>C++ (C ABI)</text><rect x='250.0' y='106.0' width='161.2' height='24.0' fill='#58a6ff' rx='2'/><text x='419.2' y='124.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>24.0 ns</text><text x='238.0' y='164.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>C# (.NET function pointer)</text><rect x='250.0' y='146.0' width='182.0' height='24.0' fill='#58a6ff' rx='2'/><text x='440.0' y='164.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>36.1 ns</text><text x='238.0' y='204.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Lua (LuaJIT FFI)</text><rect x='250.0' y='186.0' width='279.3' height='24.0' fill='#58a6ff' rx='2'/><text x='537.3' y='204.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>246 ns</text><text x='238.0' y='244.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>JavaScript (Deno FFI)</text><rect x='250.0' y='226.0' width='390.2' height='24.0' fill='#58a6ff' rx='2'/><text x='648.2' y='244.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>2.2 µs</text><text x='238.0' y='284.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Python (ctypes)</text><rect x='250.0' y='266.0' width='338.4' height='24.0' fill='#d29922' rx='2'/><text x='596.4' y='284.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>789 ns</text><text x='24.0' y='340.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Each bar is measured live: the example host for that language calls find_guest_contract in a tight loop (one FFI hop + the</text><text x='24.0' y='354.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>runtime's registry lookup; no guest code runs). Rust links the crate, so its bar is the lookup itself. Local-only; reproduce with</text><text x='24.0' y='368.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>`just bench-hostcall`. See docs/PERFORMANCE.md.</text></svg>
