<svg xmlns='http://www.w3.org/2000/svg' width='760' height='352' viewBox='0 0 760 352'><rect width='760' height='352' fill='#0d1117'/><text x='24.0' y='30.0' font-size='17' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Cross-language round trip  (host → guest → return)</text><text x='24.0' y='47.0' font-size='11' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>each host language calls a native guest's decode() and reads the string back — log scale</text><line x1='250.0' y1='56.0' x2='250.0' y2='300.0' stroke='#21262d' stroke-width='1'/><text x='250.0' y='316.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.00 ns</text><line x1='345.7' y1='56.0' x2='345.7' y2='300.0' stroke='#21262d' stroke-width='1'/><text x='345.7' y='316.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>10.0 ns</text><line x1='441.4' y1='56.0' x2='441.4' y2='300.0' stroke='#21262d' stroke-width='1'/><text x='441.4' y='316.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>100 ns</text><line x1='537.1' y1='56.0' x2='537.1' y2='300.0' stroke='#21262d' stroke-width='1'/><text x='537.1' y='316.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.0 µs</text><line x1='632.8' y1='56.0' x2='632.8' y2='300.0' stroke='#21262d' stroke-width='1'/><text x='632.8' y='316.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>10.0 µs</text><text x='238.0' y='84.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Rust (links the crate)</text><rect x='250.0' y='66.0' width='181.4' height='24.0' fill='#3fb950' rx='2'/><text x='439.4' y='84.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>78.6 ns</text><text x='238.0' y='124.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>C++ (native)</text><rect x='250.0' y='106.0' width='184.8' height='24.0' fill='#3fb950' rx='2'/><text x='442.8' y='124.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>85.3 ns</text><text x='238.0' y='164.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>C# (CLR)</text><rect x='250.0' y='146.0' width='193.1' height='24.0' fill='#3fb950' rx='2'/><text x='451.1' y='164.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>104 ns</text><text x='238.0' y='204.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Lua (LuaJIT FFI)</text><rect x='250.0' y='186.0' width='306.5' height='24.0' fill='#58a6ff' rx='2'/><text x='564.5' y='204.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.6 µs</text><text x='238.0' y='244.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Python (ctypes)</text><rect x='250.0' y='226.0' width='355.6' height='24.0' fill='#d29922' rx='2'/><text x='613.6' y='244.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>5.2 µs</text><text x='238.0' y='284.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>JavaScript (Deno FFI)</text><rect x='250.0' y='266.0' width='394.5' height='24.0' fill='#d29922' rx='2'/><text x='652.5' y='284.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>13.2 µs</text><text x='24.0' y='340.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Full end-to-end round trip per HOST language, native guest held constant — so the only variable is the host's binding cost. Compiled hosts (Rust/C++/C#) are ~80-100 ns; dynamic hosts pay their per-call marshalling. Local-only; see examples/hosts/roundtrip_bench.sh.</text></svg>
