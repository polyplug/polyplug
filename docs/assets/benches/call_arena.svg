<svg xmlns='http://www.w3.org/2000/svg' width='720' height='377' viewBox='0 0 720 377'><rect width='720' height='377' fill='#0d1117'/><text x='24.0' y='30.0' font-size='17' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Per-call return buffer: the retain-and-rewind win</text><text x='24.0' y='47.0' font-size='11' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>CallArena costs — a warm bump is ~free; the first overflow mallocs once, then every later call reuses</text><text x='24.0' y='62.0' font-size='11' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>the retained block (lower is better)</text><text x='238.0' y='98.0' font-size='12' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>reset (rewind cursor)</text><rect x='250.0' y='78.0' width='4.5' height='28.0' fill='#3fb950' rx='2'/><text x='262.5' y='98.0' font-size='12' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>0.45 ns</text><text x='238.0' y='144.0' font-size='12' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>warm bump (64 B, primary)</text><rect x='250.0' y='124.0' width='26.2' height='28.0' fill='#3fb950' rx='2'/><text x='284.2' y='144.0' font-size='12' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>2.66 ns</text><text x='238.0' y='190.0' font-size='12' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>overflow — warm reuse (retained)</text><rect x='250.0' y='170.0' width='33.8' height='28.0' fill='#3fb950' rx='2'/><text x='291.8' y='190.0' font-size='12' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>3.42 ns</text><text x='238.0' y='236.0' font-size='12' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>per-call shape (64 B)</text><rect x='250.0' y='216.0' width='74.7' height='28.0' fill='#58a6ff' rx='2'/><text x='332.7' y='236.0' font-size='12' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>7.56 ns</text><text x='238.0' y='282.0' font-size='12' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>per-call shape (64 KiB, warm)</text><rect x='250.0' y='262.0' width='77.2' height='28.0' fill='#58a6ff' rx='2'/><text x='335.2' y='282.0' font-size='12' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>7.81 ns</text><text x='238.0' y='328.0' font-size='12' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>overflow — cold first block (malloc)</text><rect x='250.0' y='308.0' width='333.9' height='28.0' fill='#d29922' rx='2'/><text x='591.9' y='328.0' font-size='12' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>33.8 ns</text><line x1='250.0' y1='65.0' x2='250.0' y2='347.0' stroke='#21262d' stroke-width='1'/></svg>
