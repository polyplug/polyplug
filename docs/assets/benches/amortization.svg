<svg xmlns='http://www.w3.org/2000/svg' width='760' height='262' viewBox='0 0 760 262'><rect width='760' height='262' fill='#0d1117'/><text x='24.0' y='30.0' font-size='17' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>One-time setup costs (paid once, not per call)</text><text x='24.0' y='47.0' font-size='11' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>loading / looking up / hot-reloading a plugin — log scale; none of these touch the per-call hot path</text><line x1='250.0' y1='56.0' x2='250.0' y2='180.0' stroke='#21262d' stroke-width='1'/><text x='250.0' y='196.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.00 ns</text><line x1='345.4' y1='56.0' x2='345.4' y2='180.0' stroke='#21262d' stroke-width='1'/><text x='345.4' y='196.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>10.0 ns</text><line x1='440.9' y1='56.0' x2='440.9' y2='180.0' stroke='#21262d' stroke-width='1'/><text x='440.9' y='196.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>100 ns</text><line x1='536.3' y1='56.0' x2='536.3' y2='180.0' stroke='#21262d' stroke-width='1'/><text x='536.3' y='196.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.0 µs</text><line x1='631.8' y1='56.0' x2='631.8' y2='180.0' stroke='#21262d' stroke-width='1'/><text x='631.8' y='196.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>10.0 µs</text><text x='238.0' y='84.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>find + resolve (per call)</text><rect x='250.0' y='66.0' width='133.9' height='24.0' fill='#3fb950' rx='2'/><text x='391.9' y='84.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>25.3 ns</text><text x='238.0' y='124.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>load bundle (dlopen + init)</text><rect x='250.0' y='106.0' width='390.9' height='24.0' fill='#d29922' rx='2'/><text x='648.9' y='124.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>12.5 µs</text><text x='238.0' y='164.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>hot-reload swap (v1 → v2)</text><rect x='250.0' y='146.0' width='394.5' height='24.0' fill='#d29922' rx='2'/><text x='652.5' y='164.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>13.6 µs</text><text x='457.0' y='214.0' font-size='10' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>time per call — log scale, lower is better →</text><text x='24.0' y='236.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>find+resolve is the only one a caller might repeat — and it is ~25 ns (a HashMap hit), warm; cold_start.svg shows the one-time</text><text x='24.0' y='250.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>cold-cache first call. Load and reload are dominated by the OS dlopen/mmap, not polyplug; see PROFILING.md.</text></svg>
