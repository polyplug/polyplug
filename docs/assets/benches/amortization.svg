<svg xmlns='http://www.w3.org/2000/svg' width='760' height='246' viewBox='0 0 760 246'><rect width='760' height='246' fill='#0d1117'/><text x='24.0' y='30.0' font-size='17' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>One-time setup costs (paid once, not per call)</text><text x='24.0' y='47.0' font-size='11' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>loading / looking up / hot-reloading a plugin — log scale; none of these touch the per-call hot path</text><line x1='250.0' y1='56.0' x2='250.0' y2='180.0' stroke='#21262d' stroke-width='1'/><text x='250.0' y='196.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.00 ns</text><line x1='342.8' y1='56.0' x2='342.8' y2='180.0' stroke='#21262d' stroke-width='1'/><text x='342.8' y='196.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>10.0 ns</text><line x1='435.5' y1='56.0' x2='435.5' y2='180.0' stroke='#21262d' stroke-width='1'/><text x='435.5' y='196.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>100 ns</text><line x1='528.3' y1='56.0' x2='528.3' y2='180.0' stroke='#21262d' stroke-width='1'/><text x='528.3' y='196.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.0 µs</text><line x1='621.0' y1='56.0' x2='621.0' y2='180.0' stroke='#21262d' stroke-width='1'/><text x='621.0' y='196.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>10.0 µs</text><text x='238.0' y='84.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>find + resolve (per call)</text><rect x='250.0' y='66.0' width='124.4' height='24.0' fill='#3fb950' rx='2'/><text x='382.4' y='84.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>21.9 ns</text><text x='238.0' y='124.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>load bundle (dlopen + init)</text><rect x='250.0' y='106.0' width='380.9' height='24.0' fill='#d29922' rx='2'/><text x='638.9' y='124.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>12.8 µs</text><text x='238.0' y='164.0' font-size='11' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>hot-reload swap (v1 → v2)</text><rect x='250.0' y='146.0' width='395.1' height='24.0' fill='#d29922' rx='2'/><text x='653.1' y='164.0' font-size='11' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>18.2 µs</text><text x='24.0' y='220.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>find+resolve is the only one a caller might repeat — and it is ~20 ns (a HashMap hit). Load and reload are dominated by the OS</text><text x='24.0' y='234.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>dlopen/mmap, not polyplug; see PROFILING.md.</text></svg>
