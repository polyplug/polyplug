enlo,monospace'>slower</text><text x='132.0' y='452.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>54.5 ns</text><text x='212.0' y='452.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>1.3 µs</text><text x='292.0' y='452.0' font-size='9' fill='#8b949e' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>32.4 µs</text><text x='24.0' y='472.0' font-size='10' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Same decode() work, no polyplug — the floor each native diagonal cell sits above:</text><text x='120.0' y='497.0' font-size='10' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Rust · direct (no plugin)</text><rect x='132.0' y='489.0' width='305.0' height='11.0' fill='#6e7681' rx='2'/><text x='445.0' y='497.0' font-size='10' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>54.8 ns</text><text x='120.0' y='515.0' font-size='10' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Rust · raw FFI</text><rect x='132.0' y='507.0' width='373.9' height='11.0' fill='#58a6ff' rx='2'/><text x='513.9' y='515.0' font-size='10' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>67.2 ns</text><text x='120.0' y='533.0' font-size='10' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Rust · polyplug</text><rect x='132.0' y='525.0' width='450.9' height='11.0' fill='#3fb950' rx='2'/><text x='590.9' y='533.0' font-size='10' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>81.1 ns</text><text x='120.0' y='551.0' font-size='10' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>C++ · direct (no plugin)</text><rect x='132.0' y='543.0' width='167.5' height='11.0' fill='#6e7681' rx='2'/><text x='307.5' y='551.0' font-size='10' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>30.1 ns</text><text x='120.0' y='569.0' font-size='10' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>C++ · raw FFI</text><rect x='132.0' y='561.0' width='150.2' height='11.0' fill='#58a6ff' rx='2'/><text x='290.2' y='569.0' font-size='10' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>27.0 ns</text><text x='120.0' y='587.0' font-size='10' fill='#c9d1d9' text-anchor='end' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>C++ · polyplug</text><rect x='132.0' y='579.0' width='307.7' height='11.0' fill='#3fb950' rx='2'/><text x='447.7' y='587.0' font-size='10' fill='#c9d1d9' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>55.3 ns</text><text x='24.0' y='610.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Each cell is measured end to end (build the argument, call, read the returned string). Compiled hosts (Rust/C++/C#) add a</text><text x='24.0' y='624.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>small constant; scripted hosts pay per-call marshalling. A C# app loading a C# plugin reuses the host's own .NET runtime. The</text><text x='24.0' y='638.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>strip above is the SAME decode() work with NO polyplug — direct (the work alone) and hand-rolled raw FFI — so the native cell</text><text x='24.0' y='652.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>minus raw FFI is polyplug's overhead for real string-returning work. Local-only; see examples/hosts/roundtrip_bench.sh.</text></svg>
