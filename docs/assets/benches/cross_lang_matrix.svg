nlo,monospace'>slower</text><text x='24.0' y='448.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Each cell is measured end to end (build the argument, call, read the returned string). Compiled hosts (Rust/C++/C#) add a</text><text x='24.0' y='462.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>small constant; scripted hosts pay per-call marshalling. A C# app loading a C# plugin reuses the host's own .NET runtime.</text><text x='24.0' y='476.0' font-size='9' fill='#8b949e' text-anchor='start' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Local-only; see examples/hosts/roundtrip_bench.sh.</text></svg>
