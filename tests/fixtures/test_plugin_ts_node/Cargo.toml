[package]
name             = "test_plugin_ts_node"
version          = "0.1.0"
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
publish          = false

[lib]
name       = "test_plugin_ts_node"
path       = "src/lib.rs"
crate-type = ["cdylib"]

# NO [dependencies] section — ABI types are mirrored inline.
# We cannot depend on polyplug here (cdylib circular dependency,
# and the ABI is frozen per §7 ABI Stability). Mirror exactly like
# tests/fixtures/test_plugin/Cargo.toml.

[lints]
workspace = true
