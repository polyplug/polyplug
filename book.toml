[book]
title = "polyplug"
description = "The native-speed plugin runtime for trusted, first-party extensibility — across six languages."
authors = ["Islam Nofl"]
language = "en"
src = "docs"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/polyplug/polyplug"
edit-url-template = "https://github.com/polyplug/polyplug/edit/main/{path}"
site-url = "/polyplug/"
no-section-label = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2

[output.html.print]
enable = true
