[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyplug-loaders-python"
version = "0.1.0"
description = "Python loader for polyplug"
requires-python = ">=3.11"
dependencies = [
    "polyplug",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["polyplug_loaders_python*"]
