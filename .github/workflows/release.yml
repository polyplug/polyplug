name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (build but do not publish)"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-native:
    name: Build native (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: .so
            exe: ""
          - platform: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            ext: .dylib
            exe: ""
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .dll
            exe: .exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev liblua5.4-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install python@3.12 lua

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          # Python is typically pre-installed on Windows runners
          echo "Python should be available"

      - name: Build all native libraries
        run: |
          cargo build --release -p polyplug --target ${{ matrix.target }}
          cargo build --release -p polyplug_native --target ${{ matrix.target }}
          cargo build --release -p polyplug_python --target ${{ matrix.target }}
          cargo build --release -p polyplug_lua --target ${{ matrix.target }}
          cargo build --release -p polyplug_js --target ${{ matrix.target }}
          cargo build --release -p polyplug_dotnet --target ${{ matrix.target }}

      - name: Build CLI tool
        run: cargo build --release -p polyplugc --target ${{ matrix.target }}

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          TARGET_DIR="target/${{ matrix.target }}/release"
          EXT="${{ matrix.ext }}"
          EXE="${{ matrix.exe }}"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$TARGET_DIR/polyplug$EXT" artifacts/
            cp "$TARGET_DIR/polyplug_native$EXT" artifacts/ || true
            cp "$TARGET_DIR/polyplug_python$EXT" artifacts/ || true
            cp "$TARGET_DIR/polyplug_lua$EXT" artifacts/ || true
            cp "$TARGET_DIR/polyplug_js$EXT" artifacts/ || true
            cp "$TARGET_DIR/polyplug_dotnet$EXT" artifacts/ || true
            cp "$TARGET_DIR/polyplugc$EXE" artifacts/
          else
            cp "$TARGET_DIR/libpolyplug$EXT" artifacts/
            cp "$TARGET_DIR/libpolyplug_native$EXT" artifacts/ || true
            cp "$TARGET_DIR/libpolyplug_python$EXT" artifacts/ || true
            cp "$TARGET_DIR/libpolyplug_lua$EXT" artifacts/ || true
            cp "$TARGET_DIR/libpolyplug_js$EXT" artifacts/ || true
            cp "$TARGET_DIR/libpolyplug_dotnet$EXT" artifacts/ || true
            cp "$TARGET_DIR/polyplugc" artifacts/
          fi

          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: artifacts/
          retention-days: 1

  test-native:
    name: Test native (${{ matrix.platform }})
    needs: build-native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            ext: .so
          - platform: macos-arm64
            os: macos-14
            ext: .dylib
          - platform: windows-x64
            os: windows-latest
            ext: .dll

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: native

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Python native loading
        shell: bash
        run: |
          mkdir -p sdks/python/host/polyplug/_native/${{ matrix.platform }}
          cp native/*${{ matrix.ext }} sdks/python/host/polyplug/_native/${{ matrix.platform }}/ 2>/dev/null || true
          cd sdks/python/host
          PYTHONPATH="$GITHUB_WORKSPACE/sdks/python/host:$GITHUB_WORKSPACE/sdks/python/polyplug_abi:$GITHUB_WORKSPACE/sdks/python" \
            python3 -c "from polyplug._native import load_native_lib; lib = load_native_lib(); print(f'Python: OK - {lib._name}')"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test Deno native loading
        shell: bash
        run: |
          mkdir -p sdks/js/host/polyplug/_native/${{ matrix.platform }}
          cp native/*${{ matrix.ext }} sdks/js/host/polyplug/_native/${{ matrix.platform }}/ 2>/dev/null || true
          cd sdks/js/host
          deno eval "import { loadNativeLibrary } from './polyplug/native-loader.ts'; const r = loadNativeLibrary(); console.log('Deno: OK -', r.path);"

      - name: Set up LuaJIT (Unix only)
        if: runner.os != 'Windows'
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "luajit-2.1.0-beta3"

      - name: Test Lua native loading (Unix only)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p sdks/lua/host/_native/${{ matrix.platform }}
          cp native/*${{ matrix.ext }} sdks/lua/host/_native/${{ matrix.platform }}/ 2>/dev/null || true
          cd sdks/lua/host
          LUA_PATH="./?.lua;./?/init.lua;$GITHUB_WORKSPACE/sdks/lua/abi/?.lua;;" \
            luajit -e "local p = require('polyplug'); print('Lua: OK - ' .. require('polyplug.native').platform())"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test C# native loading
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            rid="win-x64"; lib="native/polyplug.dll"
          elif [ "${{ matrix.platform }}" = "macos-arm64" ]; then
            rid="osx-arm64"; lib="native/libpolyplug.dylib"
          else
            rid="linux-x64"; lib="native/libpolyplug.so"
          fi
          mkdir -p "sdks/csharp/host/runtimes/$rid/native"
          cp "$lib" "sdks/csharp/host/runtimes/$rid/native/"
          dotnet build sdks/csharp/host/Polyplug.Host.csproj -c Release
          echo "C#: OK"

  # ---------------------------------------------------------------------------
  # The single "min" job every publish job depends on. It collects the per-OS
  # native artifacts into one organized dist/ bundle (+ the version string) and
  # republishes it as one artifact so each publish job can fan out in parallel.
  # Each publish job below depends ONLY on `prep`, so they run concurrently and
  # a single failed registry can be re-run on its own ("Re-run failed jobs").
  # ---------------------------------------------------------------------------
  prep:
    name: Prep dist bundle
    needs: [build-native, test-native]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-artifacts
          merge-multiple: false

      - name: Organize native libraries
        run: |
          mkdir -p dist/native/{linux-x64,macos-arm64,windows-x64}
          mkdir -p dist/cli/{linux-x64,macos-arm64,windows-x64}

          cp native-artifacts/native-linux-x64/libpolyplug.so dist/native/linux-x64/
          cp native-artifacts/native-linux-x64/libpolyplug_*.so dist/native/linux-x64/ 2>/dev/null || true
          cp native-artifacts/native-linux-x64/polyplugc dist/cli/linux-x64/

          cp native-artifacts/native-macos-arm64/libpolyplug.dylib dist/native/macos-arm64/
          cp native-artifacts/native-macos-arm64/libpolyplug_*.dylib dist/native/macos-arm64/ 2>/dev/null || true
          cp native-artifacts/native-macos-arm64/polyplugc dist/cli/macos-arm64/

          cp native-artifacts/native-windows-x64/polyplug.dll dist/native/windows-x64/
          cp native-artifacts/native-windows-x64/polyplug_*.dll dist/native/windows-x64/ 2>/dev/null || true
          cp native-artifacts/native-windows-x64/polyplugc.exe dist/cli/windows-x64/

          echo "=== Native libraries ==="
          find dist/native -type f \( -name "*.so" -o -name "*.dylib" -o -name "*.dll" \) | sort

          echo "=== CLI binaries ==="
          find dist/cli -type f | sort

      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Upload dist bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist-bundle
          path: dist/
          retention-days: 1

  # --------------------------- crates.io ------------------------------------
  publish-crates:
    name: Publish · crates.io
    needs: prep
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.dry-run
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # cargo publish verifies by building each crate; the lua/python loader
      # crates need their native dev libs present to compile during verify.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev liblua5.4-dev

      # Dependency-ordered (leaves first). polyplug_codegen precedes polyplug_abi
      # (abi build-depends on codegen); codegen's dep on abi is a dev-dependency,
      # which crates.io strips at publish, so there is no real cycle.
      - name: Publish to crates.io (dry-run)
        if: inputs.dry-run
        run: |
          for crate in polyplug_utils polyplug_codegen polyplug_abi polyplug polyplug_guest polyplug_native polyplug_python polyplug_lua polyplug_js polyplug_dotnet polyplugc; do
            echo "Dry-run: $crate"
            cargo publish -p $crate --dry-run
          done

      - name: Publish to crates.io
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # cargo (>=1.66) waits for each crate to appear in the index before
          # returning, so the next crate resolves its just-published dependency.
          for crate in polyplug_utils polyplug_codegen polyplug_abi polyplug polyplug_guest polyplug_native polyplug_python polyplug_lua polyplug_js polyplug_dotnet polyplugc; do
            echo "Publishing $crate..."
            cargo publish -p $crate
          done
          echo "All crates published successfully"

  # ------------------------------ PyPI --------------------------------------
  publish-pypi:
    name: Publish · PyPI
    needs: prep
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.dry-run
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download dist bundle
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build Python host package with embedded natives
        run: |
          cd sdks/python/host
          mkdir -p polyplug/_native/{linux-x64,macos-arm64,windows-x64}
          cp ../../../dist/native/linux-x64/libpolyplug.so polyplug/_native/linux-x64/
          cp ../../../dist/native/macos-arm64/libpolyplug.dylib polyplug/_native/macos-arm64/
          cp ../../../dist/native/windows-x64/polyplug.dll polyplug/_native/windows-x64/
          uv build --out-dir ../../../dist/pypi

      - name: Build Python guest package
        run: |
          cd sdks/python/guest
          uv build --out-dir ../../../dist/pypi

      - name: Build Python loader packages with embedded natives
        run: |
          for loader in native python lua js dotnet; do
            loader_dir="sdks/python/host/loaders/polyplug-loaders-$loader"
            if [ -d "$loader_dir" ]; then
              echo "Building polyplug-loaders-$loader..."
              if [ "$loader" = "native" ]; then
                lib_name="libpolyplug_native"
              else
                lib_name="libpolyplug_$loader"
              fi
              pkg_native="$loader_dir/polyplug_loaders_${loader}/_native"
              mkdir -p "$pkg_native"/{linux-x64,macos-arm64,windows-x64}
              cp dist/native/linux-x64/${lib_name}.so "$pkg_native/linux-x64/" 2>/dev/null || true
              cp dist/native/macos-arm64/${lib_name}.dylib "$pkg_native/macos-arm64/" 2>/dev/null || true
              cp dist/native/windows-x64/${lib_name}.dll "$pkg_native/windows-x64/" 2>/dev/null || true
              (cd "$loader_dir" && uv build --out-dir "$GITHUB_WORKSPACE/dist/pypi")
            fi
          done

      - name: Validate Python packages
        run: |
          echo "=== Python packages ==="
          ls -la dist/pypi/ || echo "no packages built"

      - name: Publish to PyPI (dry-run)
        if: inputs.dry-run
        run: |
          echo "Built packages that WOULD be published:"
          ls -la dist/pypi/

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          for dist_file in dist/pypi/*; do
            [ -f "$dist_file" ] && uv publish "$dist_file"
          done

      - name: Upload PyPI packages
        uses: actions/upload-artifact@v4
        with:
          name: pkg-pypi
          path: dist/pypi/
          retention-days: 1
          if-no-files-found: ignore

  # ------------------------------ NuGet -------------------------------------
  publish-nuget:
    name: Publish · NuGet
    needs: prep
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.dry-run
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download dist bundle
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: dist

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build NuGet host package with embedded natives
        run: |
          host_dir="sdks/csharp/host"
          mkdir -p "$host_dir/runtimes/linux-x64/native" "$host_dir/runtimes/osx-arm64/native" "$host_dir/runtimes/win-x64/native"
          cp dist/native/linux-x64/libpolyplug.so "$host_dir/runtimes/linux-x64/native/"
          cp dist/native/macos-arm64/libpolyplug.dylib "$host_dir/runtimes/osx-arm64/native/"
          cp dist/native/windows-x64/polyplug.dll "$host_dir/runtimes/win-x64/native/"
          dotnet pack "$host_dir/Polyplug.Host.csproj" -c Release -o dist/nuget

      - name: Build NuGet guest package
        run: dotnet pack sdks/csharp/guest -c Release -o dist/nuget

      - name: Build NuGet loader packages with embedded natives
        run: |
          for loader in Native Python Lua Js Dotnet; do
            loader_dir="sdks/csharp/loaders/$loader"
            loader_lower=$(echo "$loader" | tr '[:upper:]' '[:lower:]')
            lib_name="libpolyplug_$loader_lower"
            mkdir -p "$loader_dir/runtimes/linux-x64/native" "$loader_dir/runtimes/osx-arm64/native" "$loader_dir/runtimes/win-x64/native"
            cp dist/native/linux-x64/${lib_name}.so "$loader_dir/runtimes/linux-x64/native/"
            cp dist/native/macos-arm64/${lib_name}.dylib "$loader_dir/runtimes/osx-arm64/native/"
            cp dist/native/windows-x64/${lib_name}.dll "$loader_dir/runtimes/win-x64/native/"
            dotnet pack "$loader_dir" -c Release -o dist/nuget
          done

      - name: Publish to NuGet (dry-run)
        if: inputs.dry-run
        run: |
          echo "Built packages that WOULD be published:"
          ls -la dist/nuget/

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for pkg in dist/nuget/*.nupkg; do
            dotnet nuget push "$pkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: pkg-nuget
          path: dist/nuget/
          retention-days: 1
          if-no-files-found: ignore

  # ------------------------------- npm --------------------------------------
  publish-npm:
    name: Publish · npm
    needs: prep
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.dry-run
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download dist bundle
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Build npm host package with embedded natives
        run: |
          cd sdks/js/host
          mkdir -p _native/{linux-x64,macos-arm64,windows-x64}
          cp ../../../dist/native/linux-x64/libpolyplug.so _native/linux-x64/
          cp ../../../dist/native/macos-arm64/libpolyplug.dylib _native/macos-arm64/
          cp ../../../dist/native/windows-x64/polyplug.dll _native/windows-x64/

      - name: Publish to npm (dry-run)
        if: inputs.dry-run
        run: |
          cd sdks/js/host
          npm publish --dry-run

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd sdks/js/host
          npm publish --access public

  # ------------------------------- jsr --------------------------------------
  publish-jsr:
    name: Publish · jsr.io
    needs: prep
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.dry-run
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Publish to jsr.io (dry-run)
        if: inputs.dry-run
        run: |
          cd sdks/js
          deno publish --dry-run --allow-dirty

      - name: Publish to jsr.io
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          JSR_TOKEN: ${{ secrets.JSR_TOKEN }}
        run: |
          cd sdks/js
          deno publish --allow-dirty

  # ----------------------------- LuaRocks -----------------------------------
  publish-luarocks:
    name: Publish · LuaRocks
    needs: prep
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.dry-run
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download dist bundle
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: dist

      - name: Install LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks

      - name: Build LuaRocks host package with embedded natives
        run: |
          cd sdks/lua/host
          mkdir -p _native/{linux-x64,macos-arm64,windows-x64}
          cp ../../../dist/native/linux-x64/libpolyplug.so _native/linux-x64/
          cp ../../../dist/native/macos-arm64/libpolyplug.dylib _native/macos-arm64/
          cp ../../../dist/native/windows-x64/polyplug.dll _native/windows-x64/

      - name: Publish to LuaRocks (dry-run)
        if: inputs.dry-run
        run: |
          cd sdks/lua/host
          ROCKSPEC=$(ls *.rockspec 2>/dev/null | head -1)
          if [ -z "$ROCKSPEC" ]; then
            echo "::error::No .rockspec found under sdks/lua/host — author rockspecs before publishing (tracked in PP-1)."
            exit 1
          fi
          luarocks pack "$ROCKSPEC"
          echo "Would upload: $ROCKSPEC"

      - name: Publish to LuaRocks
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd sdks/lua/host
          ROCKSPEC=$(ls *.rockspec 2>/dev/null | head -1)
          if [ -z "$ROCKSPEC" ]; then
            echo "::error::No .rockspec found under sdks/lua/host."
            exit 1
          fi
          luarocks upload "$ROCKSPEC" --api-key ${{ secrets.LUAROCKS_API_KEY }}
          cd ../../sdks/lua/guest
          GUEST_ROCKSPEC=$(ls *.rockspec 2>/dev/null | head -1)
          [ -n "$GUEST_ROCKSPEC" ] && luarocks upload "$GUEST_ROCKSPEC" --api-key ${{ secrets.LUAROCKS_API_KEY }}
          for rock in "$GITHUB_WORKSPACE"/sdks/lua/host/loaders/*/*.rockspec; do
            [ -f "$rock" ] && luarocks upload "$rock" --api-key ${{ secrets.LUAROCKS_API_KEY }}
          done

  # --------------------------- GitHub Release -------------------------------
  github-release:
    name: GitHub Release
    needs: [prep, publish-crates, publish-pypi, publish-nuget, publish-npm, publish-jsr, publish-luarocks]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download dist bundle
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: dist

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: pkgs
          merge-multiple: true

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          for platform in linux-x64 macos-arm64 windows-x64; do
            for lib in dist/native/$platform/*; do
              if [ -f "$lib" ]; then
                name=$(basename "$lib"); ext="${name##*.}"; base="${name%.*}"
                cp "$lib" "release-assets/${base}-$platform.${ext}"
              fi
            done
            if [ -f "dist/cli/$platform/polyplugc" ]; then
              cp "dist/cli/$platform/polyplugc" "release-assets/polyplugc-$platform"
            elif [ -f "dist/cli/$platform/polyplugc.exe" ]; then
              cp "dist/cli/$platform/polyplugc.exe" "release-assets/polyplugc-$platform.exe"
            fi
          done

          cp pkgs/*.whl release-assets/ 2>/dev/null || true
          cp pkgs/*.tar.gz release-assets/ 2>/dev/null || true
          cp pkgs/*.nupkg release-assets/ 2>/dev/null || true
          cp pkgs/*.tgz release-assets/ 2>/dev/null || true

          ( cd release-assets && sha256sum * > SHA256SUMS )
          ls -la release-assets/
          echo "=== SHA256SUMS ==="
          cat release-assets/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## Installation

            ### Rust
            ```toml
            [dependencies]
            polyplug = "${{ needs.prep.outputs.version }}"
            polyplug_guest = "${{ needs.prep.outputs.version }}"
            # Loaders: polyplug_native / polyplug_python / polyplug_lua / polyplug_js / polyplug_dotnet
            ```
            ```bash
            cargo install polyplugc
            ```

            ### Python
            ```bash
            pip install polyplug polyplug-guest
            ```

            ### C#/.NET
            ```bash
            dotnet add package Polyplug
            dotnet add package Polyplug.Guest
            ```

            ### Node.js
            ```bash
            npm install @polyplug/sdk
            ```

            ### Lua
            ```bash
            luarocks install polyplug
            ```

            ## Native Libraries
            Native libraries (core + loaders) are embedded in the language packages; no manual install required.
