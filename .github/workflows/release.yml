name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (build but do not publish)"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-native:
    name: Build native (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: .so
            exe: ""
          - platform: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            ext: .dylib
            exe: ""
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .dll
            exe: .exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev liblua5.4-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install python@3.12 lua

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          # Python is typically pre-installed on Windows runners
          echo "Python should be available"

      - name: Build all native libraries
        run: |
          cargo build --release -p polyplug --target ${{ matrix.target }}
          cargo build --release -p polyplug_native --target ${{ matrix.target }}
          cargo build --release -p polyplug_python --target ${{ matrix.target }}
          cargo build --release -p polyplug_lua --target ${{ matrix.target }}
          cargo build --release -p polyplug_js --target ${{ matrix.target }}
          cargo build --release -p polyplug_dotnet --target ${{ matrix.target }}

      - name: Build CLI tool
        run: cargo build --release -p polyplugc --target ${{ matrix.target }}

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          TARGET_DIR="target/${{ matrix.target }}/release"
          EXT="${{ matrix.ext }}"
          EXE="${{ matrix.exe }}"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$TARGET_DIR/polyplug$EXT" artifacts/
            cp "$TARGET_DIR/polyplug_native$EXT" artifacts/ || true
            cp "$TARGET_DIR/polyplug_python$EXT" artifacts/ || true
            cp "$TARGET_DIR/polyplug_lua$EXT" artifacts/ || true
            cp "$TARGET_DIR/polyplug_js$EXT" artifacts/ || true
            cp "$TARGET_DIR/polyplug_dotnet$EXT" artifacts/ || true
            cp "$TARGET_DIR/polyplugc$EXE" artifacts/
          else
            cp "$TARGET_DIR/libpolyplug$EXT" artifacts/
            cp "$TARGET_DIR/libpolyplug_native$EXT" artifacts/ || true
            cp "$TARGET_DIR/libpolyplug_python$EXT" artifacts/ || true
            cp "$TARGET_DIR/libpolyplug_lua$EXT" artifacts/ || true
            cp "$TARGET_DIR/libpolyplug_js$EXT" artifacts/ || true
            cp "$TARGET_DIR/libpolyplug_dotnet$EXT" artifacts/ || true
            cp "$TARGET_DIR/polyplugc" artifacts/
          fi

          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: artifacts/
          retention-days: 1

  test-native:
    name: Test native (${{ matrix.platform }})
    needs: build-native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            ext: .so
          - platform: macos-arm64
            os: macos-14
            ext: .dylib
          - platform: windows-x64
            os: windows-latest
            ext: .dll

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: native

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Python native loading
        shell: bash
        run: |
          mkdir -p sdks/python/host/polyplug/_native/${{ matrix.platform }}
          cp native/*${{ matrix.ext }} sdks/python/host/polyplug/_native/${{ matrix.platform }}/ 2>/dev/null || true
          python3 -c "import sys, os; ws=os.environ['GITHUB_WORKSPACE']; sys.path[:0]=[ws+'/sdks/python/host', ws+'/sdks/python/polyplug_abi', ws+'/sdks/python']; from polyplug._native import load_native_lib; print('Python: OK -', load_native_lib()._name)"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test Deno native loading
        shell: bash
        run: |
          mkdir -p sdks/js/host/polyplug/_native/${{ matrix.platform }}
          cp native/*${{ matrix.ext }} sdks/js/host/polyplug/_native/${{ matrix.platform }}/ 2>/dev/null || true
          cd sdks/js/host
          deno eval "import { loadNativeLibrary } from './polyplug/native-loader.ts'; const r = loadNativeLibrary(); console.log('Deno: OK -', r.path);"

      - name: Set up LuaJIT (Unix only)
        if: runner.os != 'Windows'
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "luajit-2.1.0-beta3"

      - name: Test Lua native loading (Unix only)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p sdks/lua/host/_native/${{ matrix.platform }}
          cp native/*${{ matrix.ext }} sdks/lua/host/_native/${{ matrix.platform }}/ 2>/dev/null || true
          cd sdks/lua/host
          LUA_PATH="./?.lua;./?/init.lua;$GITHUB_WORKSPACE/sdks/lua/abi/?.lua;;" \
            lua -e "local p = require('polyplug'); print('Lua: OK - ' .. require('polyplug.native').platform())"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test C# native loading
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            rid="win-x64"; lib="native/polyplug.dll"
          elif [ "${{ matrix.platform }}" = "macos-arm64" ]; then
            rid="osx-arm64"; lib="native/libpolyplug.dylib"
          else
            rid="linux-x64"; lib="native/libpolyplug.so"
          fi
          mkdir -p "sdks/csharp/host/runtimes/$rid/native"
          cp "$lib" "sdks/csharp/host/runtimes/$rid/native/"
          dotnet build sdks/csharp/host/Polyplug.Host.csproj -c Release
          echo "C#: OK"

  # ---------------------------------------------------------------------------
  # The single "min" job every publish job depends on. It collects the per-OS
  # native artifacts into one organized dist/ bundle (+ the version string) and
  # republishes it as one artifact so each publish job can fan out in parallel.
  # Each publish job below depends ONLY on `prep`, so they run concurrently and
  # a single failed registry can be re-run on its own ("Re-run failed jobs").
  # ---------------------------------------------------------------------------
  prep:
    name: Prep dist bundle
    needs: [build-native, test-native]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-artifacts
          merge-multiple: false

      - name: Organize native libraries
        run: |
          mkdir -p dist/native/{linux-x64,macos-arm64,windows-x64}
          mkdir -p dist/cli/{linux-x64,macos-arm64,windows-x64}

          cp native-artifacts/native-linux-x64/libpolyplug.so dist/native/linux-x64/
          cp native-artifacts/native-linux-x64/libpolyplug_*.so dist/native/linux-x64/ 2>/dev/null || true
          cp native-artifacts/native-linux-x64/polyplugc dist/cli/linux-x64/

          cp native-artifacts/native-macos-arm64/libpolyplug.dylib dist/native/macos-arm64/
          cp native-artifacts/native-macos-arm64/libpolyplug_*.dylib dist/native/macos-arm64/ 2>/dev/null || true
          cp native-artifacts/native-macos-arm64/polyplugc dist/cli/macos-arm64/

          cp native-artifacts/native-windows-x64/polyplug.dll dist/native/windows-x64/
          cp native-artifacts/native-windows-x64/polyplug_*.dll dist/native/windows-x64/ 2>/dev/null || true
          cp native-artifacts/native-windows-x64/polyplugc.exe dist/cli/windows-x64/

          echo "=== Native libraries ==="
          find dist/native -type f \( -name "*.so" -o -name "*.dylib" -o -name "*.dll" \) | sort

          echo "=== CLI binaries ==="
          find dist/cli -type f | sort

      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # LuaRocks is source-based: the published rockspecs point at this single
      # tarball, which merges every Lua module with all-platform prebuilt natives.
      # The rockspec build.install.lua copies the platform binaries flat next to
      # the modules; the resolver loads the platform-correct one at runtime.
      - name: Build LuaRocks source tarball
        run: |
          TB="polyplug-lua-${{ steps.version.outputs.version }}"
          mkdir -p "$TB/polyplug/loaders" "$TB/_native"/{linux-x64,macos-arm64,windows-x64}
          cp sdks/lua/abi/abi.lua sdks/lua/abi/polyplug_abi.lua "$TB/"
          cp sdks/lua/guest/polyplug_guest.lua "$TB/"
          cp sdks/lua/host/polyplug.lua "$TB/"
          cp sdks/lua/host/polyplug/native.lua sdks/lua/host/polyplug/runtime.lua sdks/lua/host/polyplug/reload_phase.lua "$TB/polyplug/"
          for n in native python lua js dotnet; do
            cp "sdks/lua/loaders/$n/polyplug/loaders/$n.lua" "$TB/polyplug/loaders/"
          done
          cp dist/native/linux-x64/*.so      "$TB/_native/linux-x64/"
          cp dist/native/macos-arm64/*.dylib "$TB/_native/macos-arm64/"
          cp dist/native/windows-x64/*.dll   "$TB/_native/windows-x64/"
          mkdir -p dist/lua-src
          tar czf "dist/lua-src/$TB.tar.gz" "$TB"
          echo "=== LuaRocks tarball ==="
          tar tzf "dist/lua-src/$TB.tar.gz" | sort

      - name: Upload dist bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist-bundle
          path: dist/
          retention-days: 1

  # --------------------------- crates.io ------------------------------------
  publish-crates:
    name: Publish · crates.io
    needs: prep
    runs-on: ubuntu-latest
    # The new-crate stagger below (sleep 11m between never-before-seen crates)
    # can take ~1h, so allow well beyond the 60-minute default.
    timeout-minutes: 180
    if: startsWith(github.ref, 'refs/tags/v') || inputs.dry-run
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # cargo publish verifies by building each crate; the lua/python loader
      # crates need their native dev libs present to compile during verify.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev liblua5.4-dev

      # `cargo publish --workspace` resolves inter-member dependency order locally
      # and publishes each crate once. Inter-member dev-dependencies (e.g.
      # codegen depending on abi) are stripped at publish, so there is no cycle.
      - name: Publish to crates.io (dry-run)
        if: inputs.dry-run
        run: cargo publish --workspace --dry-run

      - name: Publish to crates.io
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -e
          VER="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          # Dependency order: utils/abi before their dependents. Do NOT reorder.
          CRATES="polyplug_utils polyplug_abi polyplug polyplug_codegen polyplug_native polyplug_python polyplug_lua polyplug_js polyplug_dotnet polyplugc polyplug_guest"
          # Publish one crate, tolerating the two non-fatal cases so a re-run after
          # a partial publish converges: already-published (skip) and the crates.io
          # new-crate rate limit (429 -> wait ~10-min refill, retry). crates.io's
          # API needs a User-Agent or it won't return 200, so the skip-check sends
          # one. The rate-limit retry is a TEMPORARY workaround until crates.io
          # raises our new-crate limit (requested via help@crates.io).
          publish_crate() {
            c="$1"
            code=$(curl -s -H 'User-Agent: polyplug-release (help@jsr.io)' -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/$c/$VER")
            if [ "$code" = "200" ]; then echo "skip $c@$VER (already on crates.io)"; return 0; fi
            for attempt in 1 2 3 4 5 6 7 8; do
              echo "publishing $c@$VER (attempt $attempt)"
              if out=$(cargo publish -p "$c" 2>&1); then echo "$out"; echo "published $c@$VER"; return 0; fi
              echo "$out"
              if echo "$out" | grep -qi 'already exists'; then echo "skip $c@$VER (already exists)"; return 0; fi
              if echo "$out" | grep -qiE '429|too many requests|rate limit'; then
                echo "rate-limited; sleeping 11m before retrying $c"; sleep 660; continue
              fi
              echo "fatal error publishing $c"; return 1
            done
            echo "still rate-limited after retries: $c"; return 1
          }
          for c in $CRATES; do publish_crate "$c" || exit 1; done

  # ------------------------------ PyPI --------------------------------------
  publish-pypi:
    name: Publish · PyPI
    needs: prep
    runs-on: ubuntu-latest
    # Publishes via an account-scoped PyPI API token (secret PYPI_API_TOKEN).
    # An account-scoped token may create new projects on first upload, so the
    # remaining loader projects are created here. skip-existing keeps the
    # already-published distributions untouched.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.dry-run
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download dist bundle
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # polyplug-abi is a runtime dependency of both polyplug and polyplug-guest,
      # so it must be published too or `pip install polyplug` cannot resolve.
      - name: Build Python abi package
        run: |
          set -e
          # Vendor the canonical generated ABI types into the package. The
          # checked-in polyplug_abi/abi.py is a source-tree shim that re-exports
          # the unpackaged `abi.abi`; the wheel must instead CONTAIN the types or
          # `import polyplug_abi` fails after install.
          cp sdks/python/abi/abi.py sdks/python/polyplug_abi/polyplug_abi/abi.py
          cd sdks/python/polyplug_abi
          uv build --out-dir ../../../dist/pypi

      - name: Build Python host package with embedded natives
        run: |
          cd sdks/python/host
          mkdir -p polyplug/_native/{linux-x64,macos-arm64,windows-x64}
          cp ../../../dist/native/linux-x64/libpolyplug.so polyplug/_native/linux-x64/
          cp ../../../dist/native/macos-arm64/libpolyplug.dylib polyplug/_native/macos-arm64/
          cp ../../../dist/native/windows-x64/polyplug.dll polyplug/_native/windows-x64/
          uv build --out-dir ../../../dist/pypi

      - name: Build Python guest package
        run: |
          cd sdks/python/guest
          uv build --out-dir ../../../dist/pypi

      - name: Build Python loader packages with embedded natives
        run: |
          set -e
          for loader in native python lua js dotnet; do
            loader_dir="sdks/python/loaders/$loader"
            if [ ! -d "$loader_dir" ]; then echo "missing loader dir: $loader_dir" >&2; exit 1; fi
            echo "Building polyplug-loaders-$loader..."
            pkg_native="$loader_dir/polyplug_loaders_${loader}/_native"
            mkdir -p "$pkg_native"/{linux-x64,macos-arm64,windows-x64}
            # Per-OS native filenames: Unix prefixes `lib`, Windows does not.
            cp dist/native/linux-x64/libpolyplug_${loader}.so "$pkg_native/linux-x64/"
            cp dist/native/macos-arm64/libpolyplug_${loader}.dylib "$pkg_native/macos-arm64/"
            cp dist/native/windows-x64/polyplug_${loader}.dll "$pkg_native/windows-x64/"
            (cd "$loader_dir" && uv build --out-dir "$GITHUB_WORKSPACE/dist/pypi")
          done

      - name: Validate Python packages
        run: |
          echo "=== Python packages ==="
          ls -la dist/pypi/ || echo "no packages built"

      - name: Publish to PyPI (dry-run)
        if: inputs.dry-run
        run: |
          echo "Built packages that WOULD be published:"
          ls -la dist/pypi/

      - name: Upload PyPI packages
        uses: actions/upload-artifact@v4
        with:
          name: pkg-pypi
          path: dist/pypi/
          retention-days: 1
          if-no-files-found: ignore

      # skip-existing leaves the already-published distributions untouched and
      # uploads only the new loader projects, which the account-scoped token
      # creates on first upload.
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  # ------------------------------ NuGet -------------------------------------
  publish-nuget:
    name: Publish · NuGet
    needs: prep
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.dry-run
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download dist bundle
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: dist

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Polyplug.Abi is a package dependency of Polyplug.Host and Polyplug.Guest
      # (plain ProjectReference -> nupkg dependency), so it must be published too
      # or `dotnet add package Polyplug` cannot resolve.
      - name: Build NuGet abi package
        run: dotnet pack sdks/csharp/abi/Polyplug.Abi.csproj -c Release -o dist/nuget

      - name: Build NuGet host package with embedded natives
        run: |
          host_dir="sdks/csharp/host"
          mkdir -p "$host_dir/runtimes/linux-x64/native" "$host_dir/runtimes/osx-arm64/native" "$host_dir/runtimes/win-x64/native"
          cp dist/native/linux-x64/libpolyplug.so "$host_dir/runtimes/linux-x64/native/"
          cp dist/native/macos-arm64/libpolyplug.dylib "$host_dir/runtimes/osx-arm64/native/"
          cp dist/native/windows-x64/polyplug.dll "$host_dir/runtimes/win-x64/native/"
          dotnet pack "$host_dir/Polyplug.Host.csproj" -c Release -o dist/nuget

      - name: Build NuGet guest package
        run: dotnet pack sdks/csharp/guest -c Release -o dist/nuget

      - name: Build NuGet loader packages with embedded natives
        run: |
          for loader in Native Python Lua Js Dotnet; do
            loader_dir="sdks/csharp/loaders/$loader"
            loader_lower=$(echo "$loader" | tr '[:upper:]' '[:lower:]')
            mkdir -p "$loader_dir/runtimes/linux-x64/native" "$loader_dir/runtimes/osx-arm64/native" "$loader_dir/runtimes/win-x64/native"
            # Per-OS native filenames: Unix prefixes `lib`, Windows does not.
            cp dist/native/linux-x64/libpolyplug_${loader_lower}.so "$loader_dir/runtimes/linux-x64/native/"
            cp dist/native/macos-arm64/libpolyplug_${loader_lower}.dylib "$loader_dir/runtimes/osx-arm64/native/"
            cp dist/native/windows-x64/polyplug_${loader_lower}.dll "$loader_dir/runtimes/win-x64/native/"
            dotnet pack "$loader_dir" -c Release -o dist/nuget
          done

      - name: Publish to NuGet (dry-run)
        if: inputs.dry-run
        run: |
          echo "Built packages that WOULD be published:"
          ls -la dist/nuget/

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for pkg in dist/nuget/*.nupkg; do
            dotnet nuget push "$pkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: pkg-nuget
          path: dist/nuget/
          retention-days: 1
          if-no-files-found: ignore

  # ------------------------------- npm --------------------------------------
  publish-npm:
    name: Publish · npm
    needs: prep
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.dry-run
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download dist bundle
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # The npm packages ship transpiled .js + .d.ts (Node/Deno refuse to
      # type-strip .ts under node_modules). The .ts/.js source stays for the
      # jsr/Deno path; only the published npm surface points at dist/.
      # Build order: abi (host imports it) -> host (loaders import its types)
      # -> loaders. guest is already pure .js and needs no transpile.
      - name: Transpile JS SDKs to dist/ (.js + .d.ts)
        run: |
          set -e
          tsc() { npx -y -p typescript@5.7 tsc "$@"; }
          ( cd sdks/js/abi  && tsc -p tsconfig.json )
          ( cd sdks/js/host && tsc -p tsconfig.json )
          for d in native python lua js dotnet; do
            ( cd "sdks/js/loaders/$d" && tsc -p tsconfig.json )
          done

      # Embed the core native into @polyplug/host's transpiled dist (the only JS
      # package with natives; loaders resolve their native via the OS loader /
      # POLYPLUG_NATIVE_LIB). native-loader.js resolves "./_native/<platform>/"
      # relative to its own location (dist/polyplug/), so stage natives there.
      - name: Embed natives into @polyplug/host
        run: |
          native_dir="sdks/js/host/dist/polyplug/_native"
          mkdir -p "$native_dir"/{linux-x64,macos-arm64,windows-x64}
          cp dist/native/linux-x64/libpolyplug.so "$native_dir/linux-x64/"
          cp dist/native/macos-arm64/libpolyplug.dylib "$native_dir/macos-arm64/"
          cp dist/native/windows-x64/polyplug.dll "$native_dir/windows-x64/"

      - name: Publish to npm (dry-run)
        if: inputs.dry-run
        run: |
          set -e
          for d in abi host guest loaders/native loaders/python loaders/lua loaders/js loaders/dotnet; do
            ( cd "sdks/js/$d" && npm publish --dry-run )
          done

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          # Dependency order: abi first (host depends on it), then host/guest,
          # then the loaders (depend on host).
          # Each publish tolerates an "already published" conflict so a re-run
          # after a partial publish converges instead of failing: if publish
          # errors but the exact name@version is already on the registry, skip.
          for d in abi host guest loaders/native loaders/python loaders/lua loaders/js loaders/dotnet; do
            ( cd "sdks/js/$d" && (npm publish --access public || { code=$?; npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version >/dev/null 2>&1 && echo "already published, skipping" || exit $code; }) )
          done

  # ------------------------------- jsr --------------------------------------
  publish-jsr:
    name: Publish · jsr.io
    needs: prep
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.dry-run
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Publish to jsr.io (dry-run)
        if: inputs.dry-run
        run: |
          set -e
          # Workspace members resolve each other locally, so they can all be
          # dry-run before anything is published.
          for d in abi host guest loaders/native loaders/python loaders/lua loaders/js loaders/dotnet; do
            ( cd "sdks/js/$d" && deno publish --dry-run --allow-dirty )
          done

      # jsr refuses to publish to a package that does not exist yet. Create each
      # of the 8 packages up front via the Management API so the publish loop
      # below never fails on 'package does not exist'. Idempotent: an existing
      # package returns 4xx, which we ignore — only auth errors (401/403) fail.
      # The token must carry broad (`_all`) permission, not just publish.
      - name: Create jsr packages (idempotent)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          JSR_TOKEN: ${{ secrets.JSR_TOKEN }}
        run: |
          set -e
          for p in abi host guest loaders-native loaders-python loaders-lua loaders-js loaders-dotnet; do
            code=$(curl -s -o /tmp/jsr_resp -w '%{http_code}' -X POST "https://api.jsr.io/scopes/polyplug/packages" \
              -H "Authorization: Bearer $JSR_TOKEN" -H "Content-Type: application/json" \
              -H "User-Agent: polyplug-release/0.1.1; https://github.com/polyplug/polyplug" \
              -d "{\"package\":\"$p\"}")
            if [ "$code" = "200" ] || [ "$code" = "201" ]; then echo "created @polyplug/$p"
            elif [ "$code" = "401" ] || [ "$code" = "403" ]; then echo "AUTH ERROR creating @polyplug/$p ($code):"; cat /tmp/jsr_resp; exit 1
            else echo "@polyplug/$p exists or skipped ($code)"; fi
          done

      - name: Publish to jsr.io
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          JSR_TOKEN: ${{ secrets.JSR_TOKEN }}
        run: |
          set -e
          # Dependency order: abi first (host depends on it), then host/guest,
          # then the loaders (depend on host).
          for d in abi host guest loaders/native loaders/python loaders/lua loaders/js loaders/dotnet; do
            ( cd "sdks/js/$d" && deno publish --token "$JSR_TOKEN" --allow-dirty )
          done

  # ----------------------------- LuaRocks -----------------------------------
  publish-luarocks:
    name: Publish · LuaRocks
    needs: prep
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.dry-run
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download dist bundle
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: dist

      - name: Install LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks

      # Stage all-platform natives into each Lua package dir so a local
      # `luarocks make` (dry-run validation) finds the files build.install.lua
      # references relative to each rockspec's directory.
      - name: Stage natives into Lua package dirs
        run: |
          mkdir -p sdks/lua/host/_native/{linux-x64,macos-arm64,windows-x64}
          cp dist/native/linux-x64/libpolyplug.so      sdks/lua/host/_native/linux-x64/
          cp dist/native/macos-arm64/libpolyplug.dylib sdks/lua/host/_native/macos-arm64/
          cp dist/native/windows-x64/polyplug.dll      sdks/lua/host/_native/windows-x64/
          for n in native python lua js dotnet; do
            d="sdks/lua/loaders/$n/_native"
            mkdir -p "$d"/{linux-x64,macos-arm64,windows-x64}
            cp dist/native/linux-x64/libpolyplug_$n.so      "$d/linux-x64/"
            cp dist/native/macos-arm64/libpolyplug_$n.dylib "$d/macos-arm64/"
            cp dist/native/windows-x64/polyplug_$n.dll      "$d/windows-x64/"
          done

      - name: Publish to LuaRocks (dry-run)
        if: inputs.dry-run
        run: |
          set -e
          for r in $(find sdks/lua -name '*.rockspec' | sort); do
            echo "lint $r"; luarocks lint "$r"
          done
          # Prove every rock installs (dependency-ordered) into a throwaway tree.
          # `luarocks make` builds from the package dir's cwd, ignoring source.url.
          TREE=/tmp/pp-lua-tree
          ( cd sdks/lua/abi   && luarocks make polyplug-abi-0.1.1-1.rockspec   --tree=$TREE --no-doc --deps-mode=one )
          ( cd sdks/lua/guest && luarocks make polyplug-guest-0.1.1-1.rockspec --tree=$TREE --no-doc --deps-mode=one )
          ( cd sdks/lua/host  && luarocks make polyplug-0.1.1-1.rockspec       --tree=$TREE --no-doc --deps-mode=one )
          for n in native python lua js dotnet; do
            ( cd "sdks/lua/loaders/$n" && luarocks make "polyplug-loader-$n-0.1.1-1.rockspec" --tree=$TREE --no-doc --deps-mode=one )
          done
          echo "All 8 Lua rockspecs lint + install cleanly."

  # --------------------------- GitHub Release -------------------------------
  github-release:
    name: GitHub Release
    # publish-pypi is intentionally NOT a dependency: its new-project throttle
    # can take a long time, and the release (plus the LuaRocks upload that needs
    # it) must not be blocked by one registry. The source tarball asset comes
    # from prep's dist bundle, so the release only needs the builds to be sound.
    needs: [prep, publish-crates, publish-nuget, publish-npm, publish-jsr, publish-luarocks]
    runs-on: ubuntu-latest
    # softprops/action-gh-release creates the release and uploads assets, which
    # requires write access to repository contents. The default GITHUB_TOKEN is
    # read-only here, so grant the scope explicitly (least privilege: this job
    # only).
    permissions:
      contents: write
    # Fire whenever the builds/tests/prep succeeded; a registry job that failed
    # or is still running does not gate the release. (prep depends on
    # build-native + test-native, so prep success implies those passed.)
    if: ${{ !cancelled() && needs.prep.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Download dist bundle
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: dist

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: pkgs
          merge-multiple: true

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          for platform in linux-x64 macos-arm64 windows-x64; do
            for lib in dist/native/$platform/*; do
              if [ -f "$lib" ]; then
                name=$(basename "$lib"); ext="${name##*.}"; base="${name%.*}"
                cp "$lib" "release-assets/${base}-$platform.${ext}"
              fi
            done
            if [ -f "dist/cli/$platform/polyplugc" ]; then
              cp "dist/cli/$platform/polyplugc" "release-assets/polyplugc-$platform"
            elif [ -f "dist/cli/$platform/polyplugc.exe" ]; then
              cp "dist/cli/$platform/polyplugc.exe" "release-assets/polyplugc-$platform.exe"
            fi
          done

          cp pkgs/*.whl release-assets/ 2>/dev/null || true
          cp pkgs/*.tar.gz release-assets/ 2>/dev/null || true
          cp pkgs/*.nupkg release-assets/ 2>/dev/null || true
          cp pkgs/*.tgz release-assets/ 2>/dev/null || true

          # LuaRocks source tarball — the published rockspecs' source.url points here.
          cp dist/lua-src/*.tar.gz release-assets/

          ( cd release-assets && sha256sum * > SHA256SUMS )
          ls -la release-assets/
          echo "=== SHA256SUMS ==="
          cat release-assets/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## Installation

            ### Rust
            ```toml
            [dependencies]
            polyplug = "${{ needs.prep.outputs.version }}"
            polyplug_guest = "${{ needs.prep.outputs.version }}"
            # Loaders: polyplug_native / polyplug_python / polyplug_lua / polyplug_js / polyplug_dotnet
            ```
            ```bash
            cargo install polyplugc
            ```

            ### Python
            ```bash
            pip install polyplug polyplug-guest
            ```

            ### C#/.NET
            ```bash
            dotnet add package Polyplug
            dotnet add package Polyplug.Guest
            ```

            ### JavaScript / TypeScript (Deno)
            Discrete packages (jsr recommended; npm mirrors them):
            ```bash
            deno add jsr:@polyplug/abi jsr:@polyplug/host jsr:@polyplug/guest
            # Loaders: jsr:@polyplug/loaders-native / -python / -lua / -js / -dotnet
            ```
            ```bash
            npm install @polyplug/host @polyplug/guest   # + @polyplug/loaders-*
            ```
            `@polyplug/abi` and `@polyplug/guest` are runtime-agnostic; `@polyplug/host`
            and the loaders require the Deno runtime for now (a Node FFI backend is planned).

            ### Lua
            ```bash
            luarocks install polyplug
            ```

            ## Native Libraries
            Native libraries (core + loaders) are embedded in the language packages; no manual install required.

  # ----------------------- LuaRocks upload (post-release) -------------------
  # Runs only after github-release has published the source tarball asset that
  # every rockspec's source.url points at. Because the asset already exists, the
  # upload packs the real source rock (no --skip-pack) so LuaRocks validates the
  # source checksum — and there is no window where a published rockspec points at
  # a missing tarball. Dependency-ordered; independently re-runnable.
  publish-luarocks-upload:
    name: Publish · LuaRocks (upload)
    needs: github-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks
          # `luarocks upload` is an API client and needs a Lua JSON library;
          # the apt luarocks ships without one. dkjson is pure Lua (no compile)
          # and installs into luarocks' own tree, which its commands always load.
          sudo luarocks install dkjson

      - name: Upload rockspecs to LuaRocks
        run: |
          set -e
          # luarocks upload exits non-zero when the revision already exists. Treat
          # that as a skip so a release re-run (e.g. a re-tag of a published
          # version) converges instead of failing; any other error is fatal.
          for r in \
            sdks/lua/abi/polyplug-abi-0.1.1-1.rockspec \
            sdks/lua/guest/polyplug-guest-0.1.1-1.rockspec \
            sdks/lua/host/polyplug-0.1.1-1.rockspec \
            sdks/lua/loaders/native/polyplug-loader-native-0.1.1-1.rockspec \
            sdks/lua/loaders/python/polyplug-loader-python-0.1.1-1.rockspec \
            sdks/lua/loaders/lua/polyplug-loader-lua-0.1.1-1.rockspec \
            sdks/lua/loaders/js/polyplug-loader-js-0.1.1-1.rockspec \
            sdks/lua/loaders/dotnet/polyplug-loader-dotnet-0.1.1-1.rockspec; do
            echo "Uploading $r"
            if out=$(luarocks upload "$r" --api-key ${{ secrets.LUAROCKS_API_KEY }} 2>&1); then
              echo "$out"
            else
              echo "$out"
              if echo "$out" | grep -qi 'already exists'; then
                echo "skip $r (already on LuaRocks)"
              else
                echo "fatal error uploading $r"
                exit 1
              fi
            fi
          done
