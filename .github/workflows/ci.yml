name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel in-flight runs for the same PR/branch to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast, cheap validation - run first to fail fast
  sdk-validator:
    name: SDK Consistency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install ast-grep
        run: |
          curl -sLO https://github.com/ast-grep/ast-grep/releases/download/0.42.0/app-x86_64-unknown-linux-gnu.zip
          unzip -j app-x86_64-unknown-linux-gnu.zip sg -d /usr/local/bin
          chmod +x /usr/local/bin/sg
      - name: Validate SDK consistency
        run: cargo run -p sdk-validator -- --config sdk-validator.yaml --fail-on-missing

  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy --workspace -- -D warnings
        run: cargo clippy --workspace -- -D warnings

  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ast-grep
        run: |
          curl -sLO https://github.com/ast-grep/ast-grep/releases/download/0.42.0/app-x86_64-unknown-linux-gnu.zip
          unzip -j app-x86_64-unknown-linux-gnu.zip sg -d /usr/local/bin
          chmod +x /usr/local/bin/sg
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build C# SDK (Polyplug.Host.dll for tests)
        run: dotnet build sdks/csharp/host/Polyplug.Host.csproj -c Debug
      - name: Build libpolyplug.so (required for deno test)
        run: cargo build -p polyplug
      - name: cargo test --workspace
        run: cargo test --workspace

  test-download-nethost:
    name: cargo build --features download-nethost
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo build -p polyplug_dotnet --features download-nethost
        run: cargo build -p polyplug_dotnet --features download-nethost
  # Single required status check — point branch protection rules at this job.
  # Adding matrix entries in the future won't require updating branch rules.
  ci:
    name: CI
    if: always()
    needs: [sdk-validator, fmt, clippy, test, test-download-nethost]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All CI jobs passed."
