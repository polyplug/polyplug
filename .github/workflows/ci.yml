name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace -- -D warnings

  sdk_validator:
    name: SDK Consistency
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install ast-grep
        run: cargo install ast-grep --locked
      - run: cargo run -p sdk-validator -- --config sdk_validator.yaml --fail-on-missing

  test:
    name: Tests
    needs: [fmt, clippy, sdk_validator]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ast-grep
        run: cargo install ast-grep --locked
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build C# SDK
        run: dotnet build sdks/csharp/host/Polyplug.Host.csproj -c Debug
      - name: Build libpolyplug.so
        run: cargo build -p polyplug
      - name: Run tests
        run: cargo test --workspace

  external-toolchains:
    name: External ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        toolchain: [dotnet, python, lua, js-quickjs]
        include:
          - toolchain: dotnet
            test_cmd: cargo test -p integration --test integration_dotnet
          - toolchain: python
            setup: sudo apt-get install -y python3-dev python3-pip
            test_cmd: cargo test -p integration --test integration_python
          - toolchain: lua
            setup: sudo apt-get install -y liblua5.4-dev
            test_cmd: cargo test -p integration --test integration_lua
          - toolchain: js-quickjs
            test_cmd: cargo test -p integration --test integration_js
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
          save-if: true
      - uses: actions/setup-dotnet@v4
        if: matrix.toolchain == 'dotnet'
        with:
          dotnet-version: '10.0.x'
      - name: Build C# SDK
        if: matrix.toolchain == 'dotnet'
        run: dotnet build sdks/csharp/host/Polyplug.Host.csproj -c Debug
      - name: Setup ${{ matrix.toolchain }}
        if: matrix.setup != ''
        run: ${{ matrix.setup }}
      - name: Run ${{ matrix.toolchain }} tests
        run: ${{ matrix.test_cmd }}

  examples:
    name: Examples
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: examples
          save-if: true
      - name: Install build-essential
        run: sudo apt-get install -y build-essential
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
      - name: Install rolldown
        run: npm install -g rolldown
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Set up LuaJIT
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: 'luajit-2.1.0-beta3'
      - name: Build release artifacts
        run: cargo build --release
      - name: Build examples
        run: bash examples/build_all.sh
      - name: Verify hosts
        run: bash examples/verify_hosts.sh

  test-download-nethost:
    name: Build with download-nethost
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build -p polyplug_dotnet --features download-nethost

  ci:
    name: CI
    if: always()
    needs: [fmt, clippy, sdk_validator, test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All CI jobs passed."