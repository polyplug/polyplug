name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace -- -D warnings

  sdk_validator:
    name: SDK Consistency
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install ast-grep
        run: cargo install ast-grep --locked
      - run: cargo run -p sdk-validator -- --config sdk_validator.yaml --fail-on-missing

  test:
    name: Tests
    needs: [fmt, clippy, sdk_validator]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ast-grep
        run: cargo install ast-grep --locked
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Required by polyplugc's generate_e2e_vm tests: deno type-checks the generated
      # QuickJS glue and luajit syntax/load-checks the generated Lua glue.
      # NOTE: leafo/gh-actions-lua provides a `lua` binary but NOT `luajit`, which
      # the tests spawn by name — install the real luajit package per OS instead.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Node runs the JS host SDK suite through the koffi FFI backend (Linux-only,
      # mirroring the Deno/Lua host suites below). Node 24+ strips TypeScript
      # types; the suite is launched via tsx (npm devDep) because the generated
      # abi.ts uses `const enum`, which Node's strip-only mode cannot erase.
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '24'
      # Bun runs the same JS host SDK suite through its built-in bun:ffi backend
      # (Linux-only, mirroring the Deno/Node host runs). Bun transpiles the .ts
      # suite (incl. the generated abi.ts `const enum`) natively, so no tsx step
      # is needed.
      - uses: oven-sh/setup-bun@v2
        if: runner.os == 'Linux'
      - name: Install LuaJIT (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Install LuaJIT (macOS)
        if: runner.os == 'macOS'
        run: brew install luajit
      - name: Build C# SDK
        run: dotnet build sdks/csharp/host/Polyplug.Host.csproj -c Debug
      # The host-SDK runtime suites below (C#, Python, C++) need both the core
      # and the native-loader cdylibs in target/debug.
      - name: Build libpolyplug + native loader
        run: cargo build -p polyplug -p polyplug_native
      # The native *_SO / *_DIR integration suites load pre-built fixture
      # cdylibs from gitignored locations that only this script produces.
      - name: Build test fixtures
        run: bash tests/fixtures/build_all.sh
      - name: Run tests
        run: cargo test --workspace
      # C# SDK xunit suites: abi.tests (layout/offset + helper asserts) and
      # host.tests (runtime create + REAL hot-reload phase delivery through the
      # FFI boundary; resolves the cdylibs from target/debug built above and
      # the reload fixtures from build_all.sh).
      - name: Run C# SDK tests
        run: |
          dotnet test sdks/csharp/abi.tests/Polyplug.Abi.Tests.csproj
          dotnet test sdks/csharp/host.tests/Polyplug.Host.Tests.csproj
      # Python host SDK runtime test: drives a REAL hot-reload through the
      # python SDK + native loader against the reload fixtures built above
      # (same suite the justfile test-host-python recipe runs).
      - name: Run Python host SDK tests
        run: |
          EXT=so
          if [ "$RUNNER_OS" = "macOS" ]; then EXT=dylib; fi
          POLYPLUG_LIB="$PWD/target/debug/libpolyplug.$EXT" \
          POLYPLUG_NATIVE_LIB="$PWD/target/debug/libpolyplug_native.$EXT" \
          python3 sdks/python/host/tests/test_reload_runtime.py
      # C++ SDK test programs (ABI layout static_asserts + guest allocator
      # tracking + REAL-runtime hot-reload phase delivery linked against the
      # cdylibs built above) — compile-and-run, seconds of wall time.
      - name: Run C++ SDK tests
        if: runner.os == 'Linux'
        run: make -C sdks/cpp test
      # Lua + JS host SDK suites (sdks/{lua,js}/host/tests) exercise the LuaJIT
      # and Deno host SDKs directly — the per-instance host-contract providers
      # (W6-B / #85) and reload paths that have NO cargo coverage (the bug class
      # that hid the Deno-host create_instance segfault and the registerLoader
      # arg-count bug, both caught only by these suites). Driven through the
      # justfile recipes so CI and `just test-host-{lua,js}` can never drift.
      # Linux-only: the cdylib extension is .so and the luajit/deno toolchains
      # mirror the Linux dev setup (matches the C++ SDK step above).
      - name: Install just
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Build Lua loader + polyplugc (for Lua host SDK suites)
        if: runner.os == 'Linux'
        run: cargo build -p polyplug_lua -p polyplugc
      - name: Run Lua + JS host SDK suites
        if: runner.os == 'Linux'
        run: just test-host-lua test-host-js
        env:
          POLYPLUG_LIB: ${{ github.workspace }}/target/debug/libpolyplug.so
          POLYPLUG_NATIVE_LIB: ${{ github.workspace }}/target/debug/libpolyplug_native.so
          POLYPLUG_LUA_LIB: ${{ github.workspace }}/target/debug/libpolyplug_lua.so
          POLYPLUGC: ${{ github.workspace }}/target/debug/polyplugc
      # The same JS host SDK suite, now under Node.js via the koffi FFI backend
      # (mirrors the Deno run above). The justfile recipe runs `npm install` if
      # node_modules is absent, so koffi + tsx are fetched here.
      - name: Run JS host SDK suite under Node
        if: runner.os == 'Linux'
        run: just test-host-js-node
        env:
          POLYPLUG_LIB: ${{ github.workspace }}/target/debug/libpolyplug.so
          POLYPLUG_NATIVE_LIB: ${{ github.workspace }}/target/debug/libpolyplug_native.so
      # The same JS host SDK suite, now under Bun via the built-in bun:ffi FFI
      # backend (mirrors the Deno/Node runs above). The justfile recipe runs
      # `bun install` if node_modules is absent.
      - name: Run JS host SDK suite under Bun
        if: runner.os == 'Linux'
        run: just test-host-js-bun
        env:
          POLYPLUG_LIB: ${{ github.workspace }}/target/debug/libpolyplug.so
          POLYPLUG_NATIVE_LIB: ${{ github.workspace }}/target/debug/libpolyplug_native.so

  windows:
    name: Windows (build + tests)
    needs: [fmt, clippy, sdk_validator]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Python (pyo3) and .NET (nethost) are present on windows-latest; setup
      # pins the versions so the polyplug_python and polyplug_dotnet loaders
      # build. The QuickJS (rquickjs-sys) and Lua (mlua) C backends build with
      # the MSVC toolchain that ships on the image.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # sdk_validator's in-crate language-validator tests shell out to the
      # ast-grep CLI (same dependency the sdk_validator job installs on Linux).
      - name: Install ast-grep
        run: cargo install ast-grep --locked
      # Build the entire workspace — this is the primary Windows gate: it proves
      # every crate, including all six language loaders, compiles on Windows MSVC.
      - name: Build workspace
        run: cargo build --workspace
      - name: Build C# SDK
        run: dotnet build sdks/csharp/host/Polyplug.Host.csproj -c Debug
      # Produce the native/C++/C# test fixture binaries (<name>.dll on Windows —
      # the script is MINGW-aware and Git Bash provides the shell; MinGW g++ and
      # dotnet are on the image/job).
      - name: Build test fixtures
        shell: bash
        run: bash tests/fixtures/build_all.sh
      # MSVC env activation must come AFTER the bash-shell cargo steps: with the
      # MSVC env set, rustc takes `link.exe` from PATH, and Git Bash's GNU
      # coreutils /usr/bin/link shadows it. (LuaJIT's msvcbuild.bat needs the env;
      # the final pwsh test step is unaffected.)
      # LuaJIT ships no prebuilt binaries on any platform; msvcbuild.bat is the
      # official Windows build (generate_e2e_vm.rs spawns `luajit`).
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build LuaJIT
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/LuaJIT/LuaJIT.git %RUNNER_TEMP%\LuaJIT
          cd /d %RUNNER_TEMP%\LuaJIT\src
          msvcbuild.bat
      - name: Add LuaJIT to PATH
        shell: bash
        run: |
          echo "$RUNNER_TEMP/LuaJIT/src" >> "$GITHUB_PATH"
          # Source-built LuaJIT has no install prefix; point require("jit.*")
          # (used by `luajit -b`) at the source tree. Trailing ';;' keeps defaults.
          echo "LUA_PATH=$RUNNER_TEMP/LuaJIT/src/?.lua;;" >> "$GITHUB_ENV"
      # Full suite: unit tests + integration/e2e tests against the fixtures built
      # above. Toolchains the polyplugc e2e tests spawn (c++, dotnet, python3,
      # deno, luajit) are provided by the image and the setup steps.
      # --no-fail-fast: default fail-fast stops after the first binary fails,
      # hiding every subsequent test binary's failures; on Windows-only iteration
      # we want every failure surfaced in a single run.
      - name: Run tests
        run: cargo test --workspace --no-fail-fast

  external-toolchains:
    name: External ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        toolchain: [dotnet, python, lua, js-quickjs]
        include:
          - toolchain: dotnet
            test_cmd: cargo test -p integration --test integration_dotnet --test integration_csharp_generated
          - toolchain: python
            setup: sudo apt-get install -y python3-dev python3-pip
            test_cmd: cargo test -p integration --test integration_python
          - toolchain: lua
            setup: sudo apt-get install -y liblua5.4-dev
            test_cmd: cargo test -p integration --test integration_lua --test integration_lua_host_contract
          - toolchain: js-quickjs
            test_cmd: cargo test -p integration --test integration_js
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
          save-if: true
      - uses: actions/setup-dotnet@v4
        if: matrix.toolchain == 'dotnet'
        with:
          dotnet-version: '10.0.x'
      - name: Build C# SDK
        if: matrix.toolchain == 'dotnet'
        run: dotnet build sdks/csharp/host/Polyplug.Host.csproj -c Debug
      # integration_csharp_generated dispatches through a GENERATED C# bundle;
      # examples/plugins-csharp/ is gitignored build output, so build the
      # transformer bundle here (same steps as examples/build_all.sh).
      - name: Build generated C# example bundle (transformer)
        if: matrix.toolchain == 'dotnet'
        run: |
          cargo build -p polyplugc
          ./target/debug/polyplugc generate \
            --bundle examples/guests/csharp/transformer/bundle.toml \
            --lang csharp --out examples/guests/csharp/transformer/generated
          dotnet publish -c Release examples/guests/csharp/transformer/Transformer.csproj \
            -o examples/plugins-csharp/csharp_transformer
          cp examples/guests/csharp/transformer/generated/manifest.toml \
            examples/plugins-csharp/csharp_transformer/
      - name: Setup ${{ matrix.toolchain }}
        if: matrix.setup != ''
        run: ${{ matrix.setup }}
      - name: Run ${{ matrix.toolchain }} tests
        run: ${{ matrix.test_cmd }}

  examples:
    name: Examples
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: examples
          save-if: true
      - name: Install build-essential
        run: sudo apt-get install -y build-essential
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
      - name: Install rolldown
        run: npm install -g rolldown
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # examples/verify_hosts.sh runs the lua host only when a `luajit` binary
      # exists (leafo/gh-actions-lua provides `lua`, not `luajit`, so it was
      # being silently skipped) — install the real package.
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Build release artifacts
        run: cargo build --release
      - name: Build examples
        run: bash examples/build_all.sh
      - name: Verify hosts
        run: bash examples/verify_hosts.sh

  test-download-nethost:
    name: Build with download-nethost
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build -p polyplug_dotnet --features download-nethost

  ci:
    name: CI
    if: always()
    needs: [fmt, clippy, sdk_validator, test, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All CI jobs passed."