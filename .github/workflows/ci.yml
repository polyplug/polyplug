name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace -- -D warnings

  sdk_validator:
    name: SDK Consistency
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install ast-grep
        run: cargo install ast-grep --locked
      - run: cargo run -p sdk-validator -- --config sdk_validator.yaml --fail-on-missing

  test:
    name: Tests
    needs: [fmt, clippy, sdk_validator]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ast-grep
        run: cargo install ast-grep --locked
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build C# SDK
        run: dotnet build sdks/csharp/host/Polyplug.Host.csproj -c Debug
      - name: Build libpolyplug.so
        run: cargo build -p polyplug
      - name: Run tests
        run: cargo test --workspace

  windows:
    name: Windows (build + unit tests)
    needs: [fmt, clippy, sdk_validator]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Python (pyo3) and .NET (nethost) are present on windows-latest; setup
      # pins the versions so the polyplug_python and polyplug_dotnet loaders
      # build. The QuickJS (rquickjs-sys) and Lua (mlua) C backends build with
      # the MSVC toolchain that ships on the image.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Build the entire workspace — this is the primary Windows gate: it proves
      # every crate, including all six language loaders, compiles on Windows MSVC.
      - name: Build workspace
        run: cargo build --workspace
      # Run library unit tests across the workspace. `--lib` runs each crate's
      # in-crate `#[cfg(test)]` suites (manifest per-platform `[file]` resolution,
      # compatibility graph, codegen emitters, error formatting) without touching
      # the `tests/` integration fixtures.
      #
      # EXCLUDED on Windows (scoping, not test-skipping):
      #   - native-loader integration tests in crates/polyplug/tests/ and the
      #     `integration` crate: they `libloading::Library::new` pre-built `.so`
      #     fixtures that are committed for Linux only. Windows needs the fixtures
      #     rebuilt+committed as `.dll` (no `lib` prefix) plus per-platform
      #     `[file]` manifest tables — a separate fixture-portability work item.
      #   - VM-loader integration suites (lua/js/python/dotnet) that depend on
      #     those same fixtures and on interpreters not provisioned in this job.
      - name: Run unit tests
        run: cargo test --workspace --lib

  external-toolchains:
    name: External ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        toolchain: [dotnet, python, lua, js-quickjs]
        include:
          - toolchain: dotnet
            test_cmd: cargo test -p integration --test integration_dotnet --test integration_csharp_generated
          - toolchain: python
            setup: sudo apt-get install -y python3-dev python3-pip
            test_cmd: cargo test -p integration --test integration_python
          - toolchain: lua
            setup: sudo apt-get install -y liblua5.4-dev
            test_cmd: cargo test -p integration --test integration_lua --test integration_lua_host_contract
          - toolchain: js-quickjs
            test_cmd: cargo test -p integration --test integration_js
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
          save-if: true
      - uses: actions/setup-dotnet@v4
        if: matrix.toolchain == 'dotnet'
        with:
          dotnet-version: '10.0.x'
      - name: Build C# SDK
        if: matrix.toolchain == 'dotnet'
        run: dotnet build sdks/csharp/host/Polyplug.Host.csproj -c Debug
      # integration_csharp_generated dispatches through a GENERATED C# bundle;
      # examples/plugins-csharp/ is gitignored build output, so build the
      # transformer bundle here (same steps as examples/build_all.sh).
      - name: Build generated C# example bundle (transformer)
        if: matrix.toolchain == 'dotnet'
        run: |
          cargo build -p polyplugc
          ./target/debug/polyplugc generate \
            --bundle examples/guests/csharp/transformer/bundle.toml \
            --lang csharp --out examples/guests/csharp/transformer/generated
          dotnet publish -c Release examples/guests/csharp/transformer/Transformer.csproj \
            -o examples/plugins-csharp/csharp_transformer
          cp examples/guests/csharp/transformer/generated/manifest.toml \
            examples/plugins-csharp/csharp_transformer/
      - name: Setup ${{ matrix.toolchain }}
        if: matrix.setup != ''
        run: ${{ matrix.setup }}
      - name: Run ${{ matrix.toolchain }} tests
        run: ${{ matrix.test_cmd }}

  examples:
    name: Examples
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: examples
          save-if: true
      - name: Install build-essential
        run: sudo apt-get install -y build-essential
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
      - name: Install rolldown
        run: npm install -g rolldown
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Set up LuaJIT
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: 'luajit-2.1.0-beta3'
      - name: Build release artifacts
        run: cargo build --release
      - name: Build examples
        run: bash examples/build_all.sh
      - name: Verify hosts
        run: bash examples/verify_hosts.sh

  test-download-nethost:
    name: Build with download-nethost
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build -p polyplug_dotnet --features download-nethost

  ci:
    name: CI
    if: always()
    needs: [fmt, clippy, sdk_validator, test, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All CI jobs passed."