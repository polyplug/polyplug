name: Cross-Platform Native Tests

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-native-loading:
    name: Test native library loading
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform_id: linux-x64
            lib_name: libpolyplug.so
          - os: macos-latest
            target: x86_64-apple-darwin
            platform_id: darwin-x64
            lib_name: libpolyplug.dylib
          - os: macos-14
            target: aarch64-apple-darwin
            platform_id: darwin-arm64
            lib_name: libpolyplug.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform_id: win32-x64
            lib_name: polyplug.dll

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build native library
        run: cargo build --release -p polyplug --target ${{ matrix.target }}

      - name: Copy native library to Python host-libs
        shell: bash
        run: |
          mkdir -p host-libs/python/polyplug/_native/${{ matrix.platform_id }}
          cp target/${{ matrix.target }}/release/${{ matrix.lib_name }} host-libs/python/polyplug/_native/${{ matrix.platform_id }}/

      - name: Copy native library to JS host-libs
        shell: bash
        run: |
          mkdir -p host-libs/js/_native/${{ matrix.platform_id }}
          cp target/${{ matrix.target }}/release/${{ matrix.lib_name }} host-libs/js/_native/${{ matrix.platform_id }}/

      - name: Copy native library to Lua host-libs
        shell: bash
        run: |
          mkdir -p host-libs/lua/_native/${{ matrix.platform_id }}
          cp target/${{ matrix.target }}/release/${{ matrix.lib_name }} host-libs/lua/_native/${{ matrix.platform_id }}/

      # Python test
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Python native library loading
        shell: bash
        working-directory: host-libs/python
        run: |
          python3 -c "from polyplug._native import load_native_lib; lib = load_native_lib(); print(f'Python: Successfully loaded {lib._name}')"

      # Deno test
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test Deno native library loading
        shell: bash
        working-directory: host-libs/js
        run: |
          deno run --allow-ffi --allow-env --allow-read -e "
            import { NativeLibLoader } from './native-loader.ts';
            const loader = new NativeLibLoader();
            const lib = loader.load();
            console.log('Deno: Successfully loaded native library');
          "

      # Lua test (Linux and macOS only)
      - name: Set up LuaJIT (Unix only)
        if: runner.os != 'Windows'
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "luajit-2.1.0-beta3"

      - name: Test Lua native library loading (Unix only)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: host-libs/lua
        run: |
          luajit -e "local p = require('polyplug'); print('Lua: Successfully loaded polyplug module')"

      # Windows Lua test - skip for now as LuaJIT setup is more complex
      - name: Skip Lua test on Windows
        if: runner.os == 'Windows'
        run: echo "Lua test skipped on Windows (LuaJIT setup requires manual installation)"
