name: Build Native Library

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build native library
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: native-linux-x64
            lib_name: libpolyplug.so
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: native-macos-x64
            lib_name: libpolyplug.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: native-macos-arm64
            lib_name: libpolyplug.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: native-windows-x64
            lib_name: polyplug.dll

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build native library
        run: cargo build --release -p polyplug --target ${{ matrix.target }}

      - name: Strip debug symbols (Unix)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/${{ matrix.lib_name }}

      - name: Create artifact directory
        run: mkdir -p artifact

      - name: Copy library to artifact directory
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.lib_name }} artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifact/${{ matrix.lib_name }}
          retention-days: 30

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp artifacts/native-linux-x64/libpolyplug.so release-assets/libpolyplug-linux-x64.so
          cp artifacts/native-macos-x64/libpolyplug.dylib release-assets/libpolyplug-macos-x64.dylib
          cp artifacts/native-macos-arm64/libpolyplug.dylib release-assets/libpolyplug-macos-arm64.dylib
          cp artifacts/native-windows-x64/polyplug.dll release-assets/polyplug-windows-x64.dll

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          generate_release_notes: true
