name: Tests

on:
  push:
    branches:
      - main
  pull_request:

# Cancel in-flight runs for the same PR/branch to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─── Fast tests — run on every PR (target: < 30 seconds) ───────────────────
  fast-tests:
    name: Fast tests (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build test fixtures
        run: cargo build --workspace --tests
      - name: Run fast tests (no ignored)
        run: cargo test --workspace -- --skip stress

  # ─── Coverage — run on every PR alongside fast tests ───────────────────────
  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage (fast tests only on PRs)
        run: |
          cargo llvm-cov \
            --workspace \
            --lcov \
            --output-path lcov.info \
            -- --skip stress
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─── Stress tests — run on merge to main only ──────────────────────────────
  stress-tests:
    name: Stress tests (main only)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: true
      - name: Build test fixtures
        run: cargo build --workspace --tests
      - name: Run all tests including stress (ignored)
        run: cargo test --workspace -- --include-ignored
      - name: Generate full coverage including stress tests
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate stress coverage report
        run: |
          cargo llvm-cov \
            --workspace \
            --lcov \
            --output-path lcov-stress.info \
            -- --include-ignored
      - name: Upload stress coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov-stress.info
          flags: stress
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─── External toolchain tests — separate job (dotnet/python/lua/js) ────────
  external-toolchains:
    name: External toolchain tests (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: dotnet
            setup: |
              wget https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb -O packages-microsoft-prod.deb
              sudo dpkg -i packages-microsoft-prod.deb
              sudo apt-get update
              sudo apt-get install -y dotnet-sdk-9.0
            test_cmd: cargo test -p integration --test integration_dotnet
            feature_flag: ""
          - toolchain: python
            setup: |
              sudo apt-get install -y python3-dev python3-pip
            test_cmd: cargo test -p integration --test integration_python
            feature_flag: ""
          - toolchain: lua
            setup: |
              sudo apt-get install -y liblua5.4-dev
            test_cmd: cargo test -p integration --test integration_lua
            feature_flag: ""
          - toolchain: deno
            setup: |
              curl -fsSL https://deno.land/install.sh | sh
              echo "$HOME/.deno/bin" >> $GITHUB_PATH
            test_cmd: cargo test -p integration --test cross_language_deno
            feature_flag: ""
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
          save-if: true
      - name: Setup ${{ matrix.toolchain }} toolchain
        run: ${{ matrix.setup }}
      - name: Build test fixtures
        run: cargo build --workspace --tests
      - name: Run ${{ matrix.toolchain }} integration tests
        run: ${{ matrix.test_cmd }}

  # ─── Single required status check for branch protection ────────────────────
  tests-ok:
    name: Tests
    if: always()
    needs: [fast-tests, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required test jobs failed or were cancelled."
            exit 1
          fi
          echo "All required test jobs passed."
