name: SDK Validation

on:
  push:
    branches: [main]
    paths:
      - 'crates/polyplug_guest/**'
      - 'sdks/**'
      - 'crates/sdk-validator/**'
      - 'sdk-validator.yaml'
      - '.github/workflows/sdk-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/polyplug_guest/**'
      - 'sdks/**'
      - 'crates/sdk-validator/**'
      - 'sdk-validator.yaml'
      - '.github/workflows/sdk-validation.yml'

# Cancel in-flight runs for the same PR/branch to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: SDK Cross-Language Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install ast-grep
        run: |
          # Install pre-built binary from GitHub releases
          curl -fsSL https://raw.githubusercontent.com/ast-grep/ast-grep/main/crates/cli/install/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Build sdk-validator
        run: cargo build --package sdk-validator
      - name: Run SDK validation
        run: cargo run --package sdk-validator -- --config sdk-validator.yaml --fail-on-missing

  # Single required status check — point branch protection rules at this job.
  sdk-validation-ok:
    name: SDK Validation
    if: always()
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Verify validation passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "SDK validation failed or was cancelled."
            exit 1
          fi
          echo "SDK validation passed."