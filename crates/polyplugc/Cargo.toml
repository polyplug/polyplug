[package]
name = "polyplugc"
description = "CLI code generator for polyplug - generates type-safe bindings for multiple languages"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "polyplugc"
path = "src/main.rs"

[dependencies]
polyplug_codegen = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
polyplug = { workspace = true }
polyplug_abi = { workspace = true }
polyplug_guest = { workspace = true }
tempfile = { workspace = true }
libloading = { workspace = true }

[lints]
workspace = true
