[package]
name = "polyplug_python"
description = "Python loader for polyplug - loads Python plugins via PyO3"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# docs.rs builds in a network-isolated sandbox; pyo3 detects DOCS_RS and links no
# interpreter. Pin to the Linux target and expose the `docsrs` cfg for doc-cfg.
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "polyplug_python"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
polyplug = { workspace = true }
polyplug_common = { workspace = true }
polyplug_abi = { workspace = true }
polyplug_utils = { workspace = true }
# The stable CPython ABI matches the loader's 3.11 runtime floor and supplies
# PyO3's Windows cross-target version without a target interpreter.
pyo3 = { workspace = true, features = ["abi3-py311"] }

[target.'cfg(unix)'.dependencies]
libloading = { workspace = true }

[build-dependencies]
pyo3-build-config = { workspace = true }

[dev-dependencies]
polyplug = { workspace = true }
polyplug_abi = { workspace = true }
polyplug_utils = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }

[[test]]
name = "python_loader"
path = "tests/python_loader.rs"

[[bench]]
name = "dispatch_benchmark"
harness = false

[lints]
workspace = true
