[bundle]
name = "generator_baseline"
version = "1.2.3"
api = "api.toml"
loader = "python"
file = "generator_baseline.py"
needs_reinit_on_dep_reload = true

[[plugin]]
name = "echo_provider"
implements = ["baseline.echo@1.2"]
optional = []

[[plugin]]
name = "metrics_provider"
implements = ["baseline.metrics@2.1"]
optional = []

[[dependency]]
kind = "contract"
contract = "baseline.metrics"
min_version = "2.0.0"
