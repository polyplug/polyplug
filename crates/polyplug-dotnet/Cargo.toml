[package]
name             = "polyplug-dotnet"
version          = "0.1.0"
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true

[lib]
name       = "polyplug_dotnet"
path       = "src/lib/mod.rs"
crate-type = ["rlib"]

[dependencies]
polyplug = { path = "../polyplug" }
netcorehost = { version = "0.20", features = ["nethost", "net10_0"] }
pelite = "0.10.0"
tempfile = "3"
once_cell = "1"

[features]
download-nethost = ["netcorehost/nethost-download"]

[lints]
workspace = true
