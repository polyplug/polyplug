[package]
name = "polyplug"
description = "Universal high-performance zero-overhead cross-language plugin runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "polyplug"
crate-type = ["cdylib", "rlib"]

[dependencies]
polyplug_utils = { workspace = true }
polyplug_abi = { workspace = true }
polyplug_common = { workspace = true }
polyplug_signing = { workspace = true }

thiserror = { workspace = true }
petgraph = { workspace = true }
crossbeam-epoch = { workspace = true }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[features]
default = []

[lints]
workspace = true

[dev-dependencies]
polyplug_abi = { workspace = true, features = ["tracking"] }
polyplug_signing = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
libloading = { workspace = true }
crossbeam-epoch = { workspace = true }

[[bench]]
name = "contract_dispatch"
harness = false

[[bench]]
name = "revision_check"
harness = false

[[bench]]
name = "ffi_resolve"
harness = false

[[bench]]
name = "ffi_find_all"
harness = false

[[bench]]
name = "registry_resolve"
harness = false

[[bench]]
name = "registry_find"
harness = false

[[bench]]
name = "counter_inc"
harness = false

[[bench]]
name = "payload_scaling"
harness = false

[[bench]]
name = "amortization"
harness = false

[[bench]]
name = "contention"
harness = false

[[bench]]
name = "call_arena"
harness = false

[[bench]]
name = "guest_host_call"
harness = false

[[bench]]
name = "cold_start"
harness = false

