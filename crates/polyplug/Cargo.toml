[package]
name        = "polyplug"
version     = "0.1.0"
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true

[lib]
name       = "polyplug"
crate-type = ["cdylib", "rlib"]

[dependencies]
arc-swap  = "1.7"
thiserror  = { workspace = true }
libloading = { workspace = true }
petgraph   = { workspace = true }
serde      = { workspace = true }
toml       = { workspace = true }

[lints]
workspace = true

[[test]]
name = "integration_load"
path = "../../tests/integration_load/mod.rs"

[[test]]
name = "integration_dispatch"
path = "../../tests/integration_dispatch/mod.rs"

[[test]]
name = "integration_graph"
path = "../../tests/integration_graph/mod.rs"

[[test]]
name = "fnv1a_compat"
path = "../../tests/fnv1a_compat/mod.rs"

[[test]]
name = "integration_panic"
path = "../../tests/integration_panic/mod.rs"

[[test]]
name = "integration_codegen_rust"
path = "../../tests/integration_codegen_rust/mod.rs"

[[test]]
name = "integration_codegen_cpp"
path = "../../tests/integration_codegen_cpp/mod.rs"

[[test]]
name = "smoke"
path = "../../tests/smoke/mod.rs"

[[test]]
name = "stress_error"
path = "../../tests/stress_error/mod.rs"

[[test]]
name = "stress_memory"
path = "../../tests/stress_memory/mod.rs"

[[test]]
name = "integration_loader_dispatch"
path = "../../tests/integration_loader_dispatch/mod.rs"

[[test]]
name = "integration_cross_plugin"
path = "../../tests/integration_cross_plugin/mod.rs"

[dev-dependencies]
criterion          = { workspace = true }
polyplug-dotnet    = { path = "../../crates/polyplug-dotnet" }
polyplug-python    = { path = "../../crates/polyplug-python" }
polyplug-lua       = { path = "../../crates/polyplug-lua" }
polyplug-js       = { path = "../../crates/polyplug-js" }
tempfile           = "3"
toml               = { workspace = true }

[[test]]
name = "integration_dotnet"
path = "../../tests/integration_dotnet/mod.rs"

[[test]]
name = "library_lifetime"
path = "../../tests/library_lifetime/mod.rs"

[[test]]
name = "integration_python"
path = "../../tests/integration_python/mod.rs"

[[test]]
name = "integration_lua"
path = "../../tests/integration_lua/mod.rs"

[[test]]
name = "integration_js"
path = "../../tests/integration_js/mod.rs"

[[bench]]
name    = "vtable_dispatch"
harness = false
