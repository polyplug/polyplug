[package]
name        = "polyplug"
version     = "0.1.0"
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true

[lib]
name       = "polyplug"
crate-type = ["cdylib", "rlib"]

[dependencies]
arc-swap  = "1.7"
thiserror  = { workspace = true }
libloading = { workspace = true }
petgraph   = { workspace = true }
serde      = { workspace = true }
toml       = { workspace = true }
notify     = { version = "6", default-features = false, features = ["macos_fsevent"], optional = true }

[features]
default    = []
hot-reload = ["dep:notify"]

[lints]
workspace = true

[dev-dependencies]
criterion          = { workspace = true }
tempfile           = "3"
toml               = { workspace = true }
polyplug-dotnet    = { path = "../polyplug-dotnet" }
polyplug-python    = { path = "../polyplug-python" }
polyplug-lua       = { path = "../polyplug-lua" }
polyplug-js        = { path = "../polyplug-js" }
polyplug-js-deno   = { path = "../polyplug-js-deno" }

# Cross-crate integration tests (use multiple adapter crates — must live at workspace root)
[[test]]
name = "integration_dotnet"
path = "../../tests/integration_dotnet.rs"

[[test]]
name = "integration_lua"
path = "../../tests/integration_lua.rs"

[[test]]
name = "integration_python"
path = "../../tests/integration_python.rs"

[[test]]
name = "integration_js"
path = "../../tests/integration_js.rs"

[[test]]
name = "integration_loader_dispatch"
path = "../../tests/integration_loader_dispatch.rs"

[[test]]
name = "cross_language"
path = "../../tests/cross_language.rs"

[[test]]
name = "cross_language_deno"
path = "../../tests/cross_language_deno.rs"

[[bench]]
name    = "vtable_dispatch"
harness = false
