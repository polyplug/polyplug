[package]
name = "polyplug_lua"
description = "Lua loader for polyplug - loads LuaJIT plugins via mlua"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "polyplug_lua"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
polyplug = { workspace = true }
polyplug_abi = { workspace = true }
polyplug_utils = { workspace = true }
mlua = { workspace = true, features = ["luajit", "vendored", "send"] }


[dev-dependencies]
polyplug = { workspace = true }
polyplug_abi = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "dispatch_benchmark"
harness = false

[lints]
workspace = true
