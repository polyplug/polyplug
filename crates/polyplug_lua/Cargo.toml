[package]
name = "polyplug_lua"
description = "Lua loader for polyplug - loads LuaJIT plugins via mlua"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# docs.rs builds in a network-isolated sandbox; pin to the Linux target (where the
# vendored LuaJIT compiles) and expose the `docsrs` cfg for doc-cfg annotations.
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "polyplug_lua"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
# Native builds carry a self-contained LuaJIT, including its FFI module.
default = ["vendored-luajit"]
vendored-luajit = ["mlua/vendored"]
# Link a target-provided LuaJIT. Cross builds must replace the default with this
# feature because Cargo features are additive.
external-luajit = []


[dependencies]
polyplug = { workspace = true }
polyplug_common = { workspace = true }
polyplug_abi = { workspace = true }
polyplug_utils = { workspace = true }
mlua = { workspace = true, features = ["luajit", "send"] }
crossbeam-epoch = { workspace = true }


[dev-dependencies]
polyplug = { workspace = true }
polyplug_abi = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "dispatch_benchmark"
harness = false

[lints]
workspace = true
