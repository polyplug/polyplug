[package]
name = "polyplug_js"
description = "QuickJS loader for polyplug - loads JavaScript plugins via QuickJS"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "polyplug_js"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
polyplug = { workspace = true }
polyplug_abi = { workspace = true }
polyplug_utils = { workspace = true }
rquickjs = { workspace = true, features = ["parallel"] }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "dispatch_benchmark"
harness = false

[lints]
workspace = true
