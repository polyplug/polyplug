[package]
name = "polyplug_js"
description = "QuickJS loader for polyplug - loads JavaScript plugins via QuickJS"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# docs.rs builds in a network-isolated sandbox; pin to the Linux target (where the
# vendored QuickJS compiles) and expose the `docsrs` cfg for doc-cfg annotations.
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
polyplug = { workspace = true }
polyplug_common = { workspace = true }
polyplug_abi = { workspace = true }
polyplug_utils = { workspace = true }
rquickjs = { workspace = true, features = ["parallel"] }
thiserror = { workspace = true }
crossbeam-epoch = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "dispatch_benchmark"
harness = false

[lints]
workspace = true
