# is not compiled into release builds; consumers enable it in dev-dependencies.
tracking = []

[dependencies]
thiserror = { workspace = true }
polyplug_utils = { workspace = true }

[build-dependencies]
syn = { workspace = true }
quote = { workspace = true }
polyplug_codegen = { workspace = true }