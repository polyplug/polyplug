# .cargo/config.toml — polyplug workspace build configuration
#
# This file intentionally sets NO `target-cpu` / `target-feature` rustflags.
#
# polyplug publishes native libraries to package registries (PyPI, npm, NuGet,
# LuaRocks) and runs CI across heterogeneous runners. A binary built with
# `-C target-cpu=native` (or any above-baseline `target-cpu`) is compiled for
# the BUILD machine's exact CPU features and crashes with SIGILL on any machine
# that lacks them — including CI runners and end users' machines. Distributed
# and CI builds must use the portable x86-64 baseline, which is the default, so
# the flag is deliberately absent here.
#
# To build with your local CPU's full feature set for local benchmarking, set
# the flag in your USER config (`~/.cargo/config.toml`), which is not committed
# and applies only on your machine:
#
#   [target.x86_64-unknown-linux-gnu]
#   rustflags = ["-C", "target-cpu=native"]
