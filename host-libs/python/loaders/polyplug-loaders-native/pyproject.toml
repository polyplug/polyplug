[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyplug-loaders-native"
version = "0.1.0"
description = "Native loader for polyplug"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["."]
include = ["polyplug_loaders_native*"]
