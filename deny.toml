# cargo-deny configuration — supply-chain gate (advisories, licenses, sources).
# Run locally with `cargo deny check`; enforced in CI by the nightly workflow.

[advisories]
version = 2
# Fail on any crate with a known security advisory or a yanked release.
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licenses compatible with this project's MIT license. A dependency
# whose license is not in this list fails the check and must be reviewed before
# being added.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# First-party workspace crates (example plugins, test fixtures) are not
# dependencies and carry no license metadata; skip license checks for them.
private = { ignore = true }

[bans]
# Duplicate versions of the same crate bloat the build but are not fatal.
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Only crates.io is trusted; unknown registries or git sources fail.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
